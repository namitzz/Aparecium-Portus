@property --accent { syntax: '<color>'; inherits: true; initial-value: #6B1E2A; }

  --safe-r: env(safe-area-inset-right, 0px);
  --header-h: 170px;
  --col: 440px;
  --col-left: max(0px, calc((100% - var(--col)) / 2));

}

/* ── App shell ─────────────────────────────────────────────────────────── */
#app { position: fixed; inset: 0; overflow: hidden; background: var(--paper); z-index: 1; }

  background-size: 600px 600px, 600px 600px, 900px 900px, 200px 200px;
}

.dust { position: absolute; left: 0; top: 0; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%;

/* ── Header ────────────────────────────────────────────────────────────── */
.header {
  position: absolute; top: 0; left: var(--col-left); width: var(--col-w); z-index: 20;
  padding: calc(var(--safe-t) + 8px) calc(12px + var(--safe-r)) 6px calc(12px + var(--safe-l));
  box-shadow: var(--shadow);
}
.header::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: var(--safe-t); background: #120D0A; }
.header::after { /* double rule */
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; pointer-events: none;
  border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong);
}
@media (min-width: 520px) { .header { border-radius: 0 0 6px 6px; } }
.hparticles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.brand-row { position: relative; display: flex; align-items: center; gap: 10px; padding: 0 40px; min-height: 30px; }
.flour { flex: 1; height: 7px; position: relative; }
.flour::before { content: ''; position: absolute; left: 0; right: 6px; top: 3px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-ink)); }
.flour::after { content: ''; position: absolute; right: 0; top: 1px; width: 5px; height: 5px; transform: rotate(45deg); border: 1px solid var(--gold-ink); }
.flour.r { transform: scaleX(-1); }
.brand {
  margin: 0; font-family: var(--f-sc); font-weight: 400; font-size: 23px; line-height: 1.15; letter-spacing: .09em; white-space: nowrap;
  background: linear-gradient(180deg, #C9A541 0%, #9C7A1E 55%, #6E5212 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
}
@media (prefers-color-scheme: dark) { .brand { background-image: linear-gradient(180deg, #F2D987, #C9A227 60%, #9C7A1E); } }
.snd { position: absolute; right: -6px; top: 50%; width: 44px; height: 44px; margin-top: -22px; display: grid; place-items: center; color: var(--gold-ink); opacity: .85; }
.snd svg { width: 20px; height: 20px; }
.daytitle { position: relative; margin-top: 1px; text-align: center; font-family: var(--f-fell); font-style: italic; font-size: 17px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.countdown { position: relative; display: block; width: 100%; min-height: 30px; margin-top: 1px; padding: 2px 8px; text-align: center; font-size: 16px; line-height: 1.3; }
.cd-txt { display: inline-block; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; color: var(--text-soft); font-style: italic; }
.cd-txt b { font-style: normal; font-weight: 600; color: var(--text); }
.countdown.soon .cd-txt b {
  background: linear-gradient(100deg, var(--text) 0%, var(--text) 40%, #E9C761 50%, var(--text) 60%, var(--text) 100%) 0 0 / 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2.6s linear infinite;
}
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
.progress { position: relative; height: 12px; margin: 4px 6px 0; }
.ink-track { position: absolute; left: 0; right: 0; top: 5px; height: 1px; background: repeating-linear-gradient(90deg, var(--rule-strong) 0 3px, transparent 3px 7px); }
.ink-fill { position: absolute; left: 0; right: 0; top: 4.5px; height: 2px; border-radius: 2px; background: var(--text); transform-origin: 0 50%; transform: scaleX(0); transition: transform 1.2s cubic-bezier(.3, .7, .2, 1); }
.ptick { position: absolute; top: 2px; width: 1px; height: 8px; background: var(--gold-ink); }
.nib { position: absolute; top: -6px; left: 0; width: 16px; height: 16px; margin-left: -2px; transition: left 1.2s cubic-bezier(.3, .7, .2, 1); pointer-events: none; color: var(--text); }
.tabs { position: relative; display: flex; gap: 2px; overflow-x: auto; scroll-snap-type: x proximity; padding: 3px 0 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.tabs::-webkit-scrollbar { display: none; }
.tabs::before, .tabs::after { content: ''; flex: 1 0 0; }
.tab { position: relative; flex: 0 0 auto; scroll-snap-align: center; min-height: 46px; min-width: 78px; padding: 2px 8px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; color: var(--text-soft); transition: color .4s; }
.tab-day { font-family: var(--f-sc); font-size: 17px; letter-spacing: .05em; display: flex; align-items: center; gap: 3px; }
.tab-date { font-style: italic; font-size: 14px; }
.tab::after { content: ''; position: absolute; left: 14%; right: 14%; bottom: 2px; height: 6px; opacity: 0; transform: scaleX(.3); transition: opacity .35s, transform .45s cubic-bezier(.3, .8, .3, 1);
  background: var(--accent-ink); -webkit-mask: var(--underline) center / 100% 100% no-repeat; mask: var(--underline) center / 100% 100% no-repeat; }
.tab[aria-selected="true"] { color: var(--accent-ink); }
.tab[aria-selected="true"] .tab-day { font-weight: 600; }
.tab[aria-selected="true"]::after { opacity: 1; transform: none; }
.star { color: #C9A227; font-size: 11px; text-shadow: 0 0 5px rgba(255, 210, 110, .9); animation: twinkle 3s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

/* ── Mode toggle ───────────────────────────────────────────────────────── */
.modes { position: absolute; z-index: 15; top: calc(var(--header-h) + 10px); left: 50%; transform: translateX(-50%);
  display: grid; grid-template-columns: repeat(3, 1fr); padding: 3px; border-radius: 6px; border: 1px solid var(--rule-strong);
  box-shadow: 0 4px 14px rgba(30, 18, 8, .22); width: min(312px, calc(100% - 28px)); transition: opacity .3s; }
.card-open .modes { opacity: 0; pointer-events: none; }
.mode { position: relative; z-index: 1; min-height: 40px; font-family: var(--f-sc); font-size: 16px; letter-spacing: .05em; border-radius: 4px; transition: color .35s; color: var(--text-soft); }
.mode[aria-checked="true"] { color: #F3E9D2; }
.mode-thumb { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3); border-radius: 4px;
  background: var(--accent); box-shadow: inset 0 0 0 1px rgba(226, 194, 106, .45); transition: transform .5s cubic-bezier(.3, 1.1, .4, 1); }

/* ── Floating buttons (move with the sheet) ───────────────────────────── */
.floatbar { position: absolute; z-index: 17; left: var(--col-left); width: var(--col-w); top: 0; height: 56px; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: space-between; padding: 0 calc(12px + var(--safe-r)) 0 calc(12px + var(--safe-l)); will-change: transform; transition: opacity .3s; }
.floatbar.hide { opacity: 0; }
.floatbar.hide * { pointer-events: none !important; }
.attrib { pointer-events: auto; font-size: 11px; line-height: 1.2; color: var(--text); opacity: .75; padding: 2px 6px; border-radius: 3px; background: var(--label-bg); margin-bottom: 4px; font-variant-numeric: normal; }
.attrib a { text-decoration: none; }
.fabs { display: flex; gap: 10px; pointer-events: auto; }
.fab { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: var(--text); border: 1px solid var(--rule-strong);
  box-shadow: 0 4px 12px rgba(30, 18, 8, .3), inset 0 0 0 3px var(--paper), inset 0 0 0 4px var(--rule); }
.fab svg { width: 22px; height: 22px; }
.fab.is-on { color: var(--gold-ink); }

/* ── Bottom sheet ──────────────────────────────────────────────────────── */
.sheet { position: absolute; z-index: 18; left: var(--col-left); width: var(--col-w); bottom: 0; height: 70%;
  display: flex; flex-direction: column; transform: translate3d(0, 100%, 0); will-change: transform; }
.sheet-bg { position: absolute; inset: -10px 0 0; z-index: -1; pointer-events: none; filter: drop-shadow(0 -6px 14px rgba(30, 18, 8, .28));
  -webkit-mask: var(--deckle) top / 100% 12px no-repeat, linear-gradient(#000, #000) 0 11px / 100% calc(100% - 11px) no-repeat;
          mask: var(--deckle) top / 100% 12px no-repeat, linear-gradient(#000, #000) 0 11px / 100% calc(100% - 11px) no-repeat; }
.sheet-grab { flex: 0 0 auto; touch-action: none; cursor: grab; padding: 4px calc(16px + var(--safe-r)) 8px calc(16px + var(--safe-l)); }
.handle { width: 40px; height: 3px; border-radius: 2px; background: var(--rule-strong); margin: 0 auto 8px; }
.sheet-head { display: flex; align-items: center; gap: 12px; min-height: 50px; }
.dnum { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; text-align: center; line-height: 1;
  border: 1px solid var(--rule-strong); box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 4px var(--accent-ink); color: var(--accent-ink);
  font-family: var(--f-sc); font-size: 21px; }
.shead-t { min-width: 0; flex: 1; }
.shead-title { font-family: var(--f-fell); font-size: 19px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shead-sub { font-size: 15px; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-style: italic; }
.shead-wx { font-size: 14px; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-body { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 2px calc(14px + var(--safe-r)) calc(var(--sheet-off, 0px) + 30px + var(--safe-b)) calc(14px + var(--safe-l)); }

/* Running late */
.late { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 2px 0 10px; }
.late-btn { min-height: 36px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--rule-strong); font-family: var(--f-fell); font-style: italic; font-size: 15px; color: var(--text-soft); }
.late-btn.on { color: var(--accent-ink); border-color: var(--accent-ink); }
.late-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.late-opts button { min-width: 48px; min-height: 36px; padding: 0 10px; border-radius: 4px; border: 1px solid var(--rule); font-size: 15px; }
.late-opts button[aria-pressed="true"] { background: var(--accent); color: #F3E9D2; border-color: var(--accent); }

/* ── Timeline ──────────────────────────────────────────────────────────── */
.sec-title { display: flex; align-items: center; gap: 10px; margin: 20px 4px 10px; font-family: var(--f-sc); font-size: 16px; letter-spacing: .08em; color: var(--gold-ink); }
.sec-title::before, .sec-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--rule-strong), transparent); }
.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl::before { content: ''; position: absolute; left: 89px; top: 34px; bottom: 34px; width: 2px;
  background: radial-gradient(circle, var(--text-soft) 0 1px, transparent 1.3px) 0 0 / 2px 8px repeat-y; opacity: .75; }
.tl-item { position: relative; display: grid; grid-template-columns: 46px 46px 1fr; gap: 12px; align-items: center; width: 100%;
  min-height: 66px; padding: 9px 10px 9px 0; border-radius: 4px; text-align: left; transition: background-color .4s, box-shadow .4s, opacity .4s; }
.tl-time { font-family: var(--f-fell); font-size: 17px; text-align: right; line-height: 1.1; }
.tl-time s { display: block; font-size: 13px; color: var(--text-soft); text-decoration-thickness: 1px; }
.tl-node { position: relative; width: 46px; height: 46px; border-radius: 50%; z-index: 1; }
.tl-node .ph, .tl-node .mono { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 1px var(--text), 0 0 0 3px var(--paper), 0 0 0 4px var(--gold-ink); }
.tl-node .ph { filter: sepia(.25) contrast(1.04); background: var(--paper-2); }
.tl-node .num { position: absolute; left: -6px; top: -5px; width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; line-height: 1;
  background: var(--paper); color: var(--text); border: 1px solid var(--text); font-variant-numeric: lining-nums; }
.tl-name { font-weight: 600; font-size: 18px; line-height: 1.2; }
.tl-act { font-size: 16px; line-height: 1.3; color: var(--text-soft); }
.tl-badge { display: inline-block; margin-left: 6px; padding: 0 6px; border: 1px solid var(--accent-ink); border-radius: 3px; font-family: var(--f-sc); font-size: 13px; letter-spacing: .06em; color: var(--accent-ink); vertical-align: 2px; }
.tl-item.done { opacity: .55; }
.tl-item.done .tl-name { text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: var(--rule-strong); }
.tl-item.done .ph { filter: grayscale(1) sepia(.35); }
.tl-item.done .num { background: var(--text); color: var(--paper); }
.tl-item.hl { background: linear-gradient(90deg, rgba(201, 162, 39, .18), rgba(201, 162, 39, .05)); box-shadow: inset 2px 0 0 var(--gold), 0 0 22px rgba(226, 194, 106, .22); }
.tl-gap { display: flex; align-items: center; min-height: 26px; padding-left: 104px; font-family: var(--f-fell); font-style: italic; font-size: 15px; color: var(--text-soft); }

.mm-end { display: flex; align-items: center; gap: 12px; width: 100%; margin: 16px 0 4px; padding: 10px 14px; min-height: 56px; border-radius: 4px; border: 1px solid var(--rule); text-align: left; }
.mm-end .seal-big { flex: 0 0 auto; width: 36px; height: 36px; display: grid; place-items: center; color: #F1DFC0; font-family: var(--f-sc); font-size: 12px; background: var(--seal-img) center/contain no-repeat; }
.mm-end-t { font-family: var(--f-script); font-size: 25px; line-height: 1.1; color: var(--text); }
.mm-end-t small { display: block; font-family: var(--f-body); font-size: 14px; color: var(--text-soft); font-style: italic; }

/* Edmondson-style card ticket */
.ticket { position: relative; margin: 4px 4px 16px; padding: 12px 18px; color: #2B1D14; border-radius: 3px;
  background-color: #EFE1BD; background-image: var(--fibres), linear-gradient(160deg, rgba(255, 255, 255, .3), transparent 50%);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .22), inset 0 0 0 1px rgba(90, 60, 30, .25); }
.ticket::before { content: ''; position: absolute; inset: 5px; border: 1px solid rgba(43, 29, 20, .35); pointer-events: none; }
.ticket::after { content: ''; position: absolute; right: 22px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .35); }
.tk-top { display: flex; justify-content: space-between; font-family: var(--f-sc); font-size: 12px; letter-spacing: .14em; color: #6B1E2A; }
.tk-route { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 6px 22px 0 0; font-family: var(--f-sc); font-size: 21px; line-height: 1.1; }
.tk-route i { font-family: var(--f-fell); font-size: 15px; color: #6B1E2A; }
.tk-stations { display: flex; justify-content: space-between; gap: 8px; margin-right: 22px; font-style: italic; font-size: 14px; color: #5A4433; }
.tk-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 22px 0 0; padding-top: 7px; border-top: 1px dashed rgba(43, 29, 20, .4); text-align: center; }
.tk-row small { display: block; font-family: var(--f-sc); font-size: 11px; letter-spacing: .12em; color: #6B1E2A; }
.tk-row b { font-family: var(--f-fell); font-size: 20px; font-weight: 400; }
.tk-foot { margin-top: 5px; font-size: 13px; color: #5A4433; text-align: center; font-style: italic; }
.ticket.done { opacity: .6; }

.food-list { display: grid; gap: 8px; }
.food-item { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; width: 100%; min-height: 70px; padding: 9px 10px; border-radius: 4px; text-align: left; border: 1px solid var(--rule); }
.food-item .ph, .food-item .mono { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 1px var(--text), 0 0 0 3px var(--paper), 0 0 0 4px #A86A2C; }
.food-item .ph { filter: sepia(.2); }
.food-name { font-weight: 600; font-size: 18px; line-height: 1.2; }
.food-meta { font-size: 15px; color: var(--text-soft); }
.food-note { font-family: var(--f-fell); font-style: italic; font-size: 16px; line-height: 1.25; }
.chip { display: inline-block; padding: 0 6px; border: 1px solid #A86A2C; border-radius: 3px; font-size: 13px; color: #A86A2C; vertical-align: 1px; }
@media (prefers-color-scheme: dark) { .chip { color: #E0A863; border-color: #E0A863; } }
.empty-note { font-style: italic; color: var(--text-soft); text-align: center; padding: 10px; }
.sheet-attrib { margin-top: 26px; font-size: 13px; color: var(--text-soft); text-align: center; font-style: italic; }

/* ── Illuminated initial (when there's no photo) ──────────────────────── */
.mono { display: flex; align-items: center; justify-content: center; font-family: var(--f-sc); color: #6B1E2A; line-height: 1; overflow: hidden;
  background: radial-gradient(circle at 50% 40%, #F5ECD6, #E2CFA4 80%); text-shadow: 0 1px 0 rgba(255, 255, 255, .5); }
@media (prefers-color-scheme: dark) { .mono { background: radial-gradient(circle at 50% 40%, #3D2B1D, #22170F 80%); color: #E2C26A; text-shadow: none; } }
.tl-node .mono, .food-item .mono { font-size: 24px; }
.mk .mono { font-size: 21px; }
.card-photo .mono { font-size: 96px; background: radial-gradient(ellipse at 50% 45%, #F5ECD6, #DCC697 85%); }
@media (prefers-color-scheme: dark) { .card-photo .mono { background: radial-gradient(ellipse at 50% 45%, #3D2B1D, #1E140D 85%); } }

/* ── Map markers ───────────────────────────────────────────────────────── */
.mk-wrap { background: none; border: 0; }
.mk { position: relative; width: 100%; height: 100%; animation: inkIn .7s cubic-bezier(.25, .8, .3, 1) both; animation-delay: var(--delay, 0ms); }
.mk::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 1.5px solid var(--step-ink); opacity: 0; pointer-events: none;
  animation: inkRing .9s ease-out both; animation-delay: var(--delay, 0ms); }
@keyframes inkIn { 0% { opacity: 0; transform: scale(.82); } 100% { opacity: 1; transform: none; } }
@keyframes inkRing { 0% { opacity: .7; transform: scale(.6); } 100% { opacity: 0; transform: scale(1.6); } }
.mk-medal { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: var(--paper-2);
  box-shadow: 0 0 0 1.25px #2B1D14, 0 0 0 3.5px #EFE2C2, 0 0 0 4.5px #8A6A1C, 0 5px 12px rgba(30, 18, 8, .38); }
.mk-medal .ph, .mk-medal .mono { width: 100%; height: 100%; object-fit: cover; }
.mk-medal .ph { filter: sepia(.3) contrast(1.05); }
.mk-num { position: absolute; z-index: 2; left: -7px; top: -6px; width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center;
  background: #F3E9D2; color: #2B1D14; border: 1.2px solid #2B1D14; font: 600 12.5px/1 var(--f-body); font-variant-numeric: lining-nums; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.mk-label { position: absolute; z-index: 1; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
  font-family: var(--f-fell); font-style: italic; font-size: 14px; line-height: 1; color: var(--text); padding: 4px 13px 3px; background: var(--label-bg);
  border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong);
  clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 50%, 100% 100%, 0 100%, 6px 50%); transition: opacity .3s; }
.mk-halo { position: absolute; inset: -16px; border-radius: 50%; opacity: 0; pointer-events: none;
  background: radial-gradient(circle, rgba(233, 199, 97, .6) 0%, rgba(233, 199, 97, .25) 45%, rgba(233, 199, 97, 0) 70%); }
.mk.is-hl .mk-halo { animation: breathe 3s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: .45; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
.mk.is-hl .mk-num { background: #2B1D14; color: #F1D88A; border-color: #8A6A1C; }
.mk.is-done .mk-medal { filter: grayscale(.85) opacity(.72); }
.mk.is-done .mk-num { background: #2B1D14; color: #F3E9D2; }
.zoom-far .mk:not(.is-hl) .mk-label, .zoom-mid .mk:not(.is-hl) .mk-label { opacity: 0; }
.mk-food .mk-medal { box-shadow: 0 0 0 1.25px #2B1D14, 0 0 0 3.5px #EFE2C2, 0 0 0 4.5px #A86A2C, 0 4px 10px rgba(30, 18, 8, .35); }
.mk-food .mk-fork { position: absolute; z-index: 2; right: -6px; bottom: -5px; width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; background: #F3E9D2; border: 1.2px solid #A86A2C; color: #8A4E18; }
.mk-food .mk-fork svg { width: 11px; height: 11px; }
.mk-food .mk-label { color: #8A4E18; }
@media (prefers-color-scheme: dark) { .mk-food .mk-label { color: #E0A863; } }
.mk-home .crest { position: absolute; inset: 0; background: var(--crest) center/contain no-repeat; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .4)); }
.mk-home::after { display: none; }
.mk.materialise { animation: inkIn .8s ease-out both; animation-delay: var(--delay, 0ms); }
.mk.dissolve { animation: dissolve .45s ease-in forwards !important; }
@keyframes dissolve { to { opacity: 0; transform: scale(.7); } }
.mk.bounce { animation: lift .7s cubic-bezier(.3, 1.4, .5, 1) both !important; }
@keyframes lift { 0% { transform: none; } 40% { transform: translateY(-7px) scale(1.08); } 100% { transform: none; } }
.route-main, .route-ghost, .route-bleed { stroke: var(--route); }
.route-fade { transition: opacity .4s ease !important; opacity: 0 !important; }

.step-wrap { background: none; border: 0; }

@keyframes meStep { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
.me-label { position: absolute; left: 0; top: 16px; transform: translateX(-50%); white-space: nowrap; font-family: var(--f-fell); font-style: italic; font-size: 14px; line-height: 1;
  color: #2B1D14; padding: 5px 14px 4px; background: #F3E9D2; border-top: 1px solid #2B1D14; border-bottom: 1px solid #2B1D14;
  clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 50%, 100% 100%, 0 100%, 6px 50%); }
.me-glow { position: absolute; left: -50px; top: -30px; width: 100px; height: 80px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(ellipse, rgba(255, 214, 120, .55), rgba(255, 214, 120, 0) 65%); animation: breathe 3s ease-in-out infinite; }

/* ── Place card ────────────────────────────────────────────────────────── */
.card-layer { position: absolute; inset: 0; z-index: 40; pointer-events: none; }

.card-desc { margin: 8px 0; font-size: 17px; line-height: 1.5; }

.card-actions { flex: 0 0 auto; display: grid; grid-template-columns: 50px 1fr 50px; gap: 10px; padding: 10px 14px 8px; border-top: 1px solid var(--rule); position: relative; z-index: 2; }
.nav-btn { height: 50px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--rule-strong); color: var(--text); }
.nav-btn svg { width: 20px; height: 20px; }

.portus-btn { position: relative; overflow: hidden; min-height: 50px; border-radius: 4px; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: #2B1D14; color: #E8CC7A; border: 1px solid #8A6A1C; box-shadow: inset 0 0 0 3px #2B1D14, inset 0 0 0 4px rgba(226, 194, 106, .35), 0 3px 10px rgba(0, 0, 0, .3);
  font-family: var(--f-sc); font-size: 19px; letter-spacing: .14em; }
@media (prefers-color-scheme: dark) { .portus-btn { background: #5A1621; box-shadow: inset 0 0 0 3px #5A1621, inset 0 0 0 4px rgba(226, 194, 106, .35), 0 3px 10px rgba(0, 0, 0, .4); } }
.portus-btn small { font-family: var(--f-fell); font-style: italic; font-size: 14px; letter-spacing: 0; opacity: .8; }
.portus-btn svg { width: 20px; height: 20px; }

.vortex { position: fixed; inset: 0; z-index: 60; pointer-events: none; display: grid; place-items: center; }
.vortex-disc { width: 160vmax; height: 160vmax; border-radius: 50%; opacity: 0;
  background: repeating-conic-gradient(from 0deg, rgba(43, 29, 20, 0) 0deg 14deg, rgba(43, 29, 20, .5) 20deg, rgba(43, 29, 20, 0) 27deg 32deg),
              radial-gradient(circle, rgba(18, 13, 10, .96) 0 7%, rgba(43, 29, 20, .65) 24%, rgba(18, 13, 10, 0) 62%); }

/* ── Mischief Managed ──────────────────────────────────────────────────── */
.mischief { position: absolute; left: 0; right: 0; top: calc(var(--header-h) - 2px); bottom: 0; z-index: 30; perspective: 1600px; pointer-events: auto; }
.mm-panels { position: absolute; inset: 0; display: flex; }
.mm-panel { position: relative; flex: 1 1 0; height: 100%; background-color: var(--paper); background-image: linear-gradient(90deg, rgba(90, 60, 30, .12), transparent 18%, transparent 82%, rgba(90, 60, 30, .16)), var(--stains-strong), var(--fibres); background-size: auto, 600px 600px, 200px 200px; }
.mm-panel.c { background-position: 0 0, -217px -133px, -61px -97px; }
.mm-panel.r { background-position: 0 0, -431px -311px, -137px -23px; }
.mm-panel.l { transform-origin: 100% 50%; } .mm-panel.r { transform-origin: 0 50%; }
.mm-text { position: absolute; left: 6%; right: 6%; top: 34%; height: 90px; pointer-events: none; display: flex; justify-content: center; }
.mm-sub { position: absolute; left: 0; right: 0; top: calc(34% + 104px); text-align: center; font-family: var(--f-fell); font-style: italic; font-size: 18px; color: var(--text-soft); opacity: 0; pointer-events: none; }

/* ── Ink writing ───────────────────────────────────────────────────────── */
.inksvg { display: block; overflow: visible; max-width: 100%; height: 100%; }
.ink-l { fill-opacity: 0; stroke-width: .6; stroke-linejoin: round; stroke-linecap: round; paint-order: stroke;
  animation: inkStroke var(--sd, 600ms) cubic-bezier(.45, 0, .3, 1) forwards, inkFill .5s ease forwards; }
@keyframes inkStroke { to { stroke-dashoffset: 0; } }
@keyframes inkFill { to { fill-opacity: 1; stroke-opacity: .25; } }

/* ── Toast ─────────────────────────────────────────────────────────────── */
.toast { position: absolute; z-index: 50; left: 50%; top: calc(var(--header-h) + 64px); max-width: min(90%, 380px); padding: 10px 16px; border-radius: 4px;
  background: #2B1D14; color: #F3E9D2; border: 1px solid #8A6A1C; font-size: 16px; text-align: center; box-shadow: var(--shadow); font-style: italic;
  transform: translate(-50%, -8px); opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ── Gold dust (taps) ──────────────────────────────────────────────────── */
#fx { position: fixed; inset: 0; z-index: 9999; pointer-events: none; overflow: hidden; }
.spark { position: absolute; left: 0; top: 0; width: 4px; height: 4px; margin: -2px 0 0 -2px; pointer-events: none; border-radius: 50%;
  background: radial-gradient(circle, #FFF8DA 0 25%, #E3C266 55%, rgba(201, 162, 39, 0) 75%); }

/* ── Candle motes ──────────────────────────────────────────────────────── */
.mote { position: absolute; bottom: -10px; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255, 228, 160, .9) 0 20%, rgba(255, 170, 70, .35) 50%, rgba(255, 150, 0, 0) 72%);
  animation: moteRise var(--dur) linear infinite, moteFlicker 2.2s ease-in-out infinite alternate; animation-delay: var(--del), var(--del2); opacity: 0; }
@keyframes moteRise { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(var(--dx), var(--rise), 0); } }
@keyframes moteFlicker { 0% { opacity: .05; } 35% { opacity: var(--o); } 100% { opacity: calc(var(--o) * .35); } }

/* ── Opening ───────────────────────────────────────────────────────────── */
#intro { position: fixed; inset: 0; z-index: 100; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: radial-gradient(ellipse 65% 50% at 50% 42%, #2C1C10 0%, #170F09 55%, #070504 100%); color: #F3E9D2;
  padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l); }
.intro-particles { position: absolute; inset: 0; pointer-events: none; }
.skip { position: absolute; z-index: 5; top: calc(var(--safe-t) + 8px); right: calc(var(--safe-r) + 10px); min-width: 64px; min-height: 44px; padding: 0 14px;
  font-family: var(--f-sc); letter-spacing: .1em; font-size: 15px; color: rgba(243, 233, 210, .55); }
.fold-stage { position: relative; width: var(--W, 320px); height: calc(var(--W, 320px) * 1.1); }
.foldmap { position: absolute; inset: 0; perspective: 1500px; }
.fpanel { position: absolute; top: 0; bottom: 0; transform-style: preserve-3d; transition: transform 1.5s cubic-bezier(.5, .05, .25, 1); }
.fp-left { left: 0; width: 25%; transform-origin: 100% 50%; transform: rotateY(179.4deg); }
.fp-centre { left: 25%; width: 50%; }
.fp-right { left: 75%; width: 25%; transform-origin: 0 50%; transform: rotateY(-179deg); }
.fp-right .back { background-position: 0 0, -283px -167px, -71px -131px; }
.foldmap.open .fp-left, .foldmap.open .fp-right { transform: rotateY(0deg); }
.face { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; background-color: #EFE2C4; }
.face.front { background-image: var(--stains-strong), var(--fibres); background-size: 600px 600px, 200px 200px; }
.fp-left .front { background-position: 0 0, 0 0; box-shadow: inset -22px 0 26px -18px rgba(80, 48, 16, .5), inset 0 0 30px rgba(110, 70, 25, .3); }
.fp-centre .front { background-position: -173px -59px, -41px -13px; box-shadow: inset 22px 0 26px -18px rgba(80, 48, 16, .45), inset -22px 0 26px -18px rgba(80, 48, 16, .45), inset 0 0 30px rgba(110, 70, 25, .25); }
.fp-right .front { background-position: -389px -241px, -113px -71px; box-shadow: inset 22px 0 26px -18px rgba(80, 48, 16, .5), inset 0 0 30px rgba(110, 70, 25, .3); }
.face.back { transform: rotateY(180deg); background-image: linear-gradient(90deg, rgba(80, 48, 16, .2), transparent 30%, rgba(255, 250, 235, .15) 60%, rgba(80, 48, 16, .15)), var(--stains-strong), var(--fibres);
  background-size: auto, 600px 600px, 200px 200px; box-shadow: inset 0 0 28px rgba(110, 70, 25, .35), inset 0 0 0 1px rgba(80, 48, 16, .3); }
.foldmap::after { content: ''; position: absolute; left: 25%; right: 25%; top: 2%; bottom: -1%; box-shadow: 0 24px 50px rgba(0, 0, 0, .7); z-index: -1; transition: left 1s, right 1s; }
.foldmap.open::after { left: 0; right: 0; }
.packet-face { position: absolute; left: 25%; width: 50%; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; pointer-events: none; z-index: 3; transition: opacity .8s; }
.cover-web, .inside-ink { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.inside-ink { z-index: 1; }
.cover { position: relative; z-index: 1; width: 100%; padding: 16% 8px 0; display: flex; flex-direction: column; align-items: center; }
.cover-line { width: 100%; display: flex; justify-content: center; min-height: 4px; }
.inkpath { fill: none; stroke: #1B120B; stroke-linecap: round; stroke-linejoin: round; animation-name: inkDraw; animation-timing-function: cubic-bezier(.3, 0, .6, 1); animation-fill-mode: both; }
@keyframes inkDraw { to { stroke-dashoffset: 0; } }
.inkfade { opacity: 0; animation: inkAppear .9s ease-out both; }
@keyframes inkAppear { to { opacity: 1; } }
.wfoot { opacity: 0; animation: wfoot 2.8s linear forwards; }
@keyframes wfoot { 0% { opacity: 0; } 6% { opacity: .9; } 100% { opacity: 0; } }
.incant { margin: -2px 0 0; padding: 0 16px; text-align: center; transition: opacity .8s; }
.incant-1 { display: block; font-family: var(--f-fell); font-style: italic; font-size: 18px; color: rgba(243, 233, 210, .78); }
.incant-2 { display: block; margin-top: 5px; font-family: var(--f-sc); font-size: 13px; letter-spacing: .14em; color: rgba(243, 233, 210, .45); }
.ink-blot { position: absolute; left: 50%; top: 80%; width: 160px; height: 160px; margin: -80px; border-radius: 50%; opacity: 0; pointer-events: none;
  background: radial-gradient(circle, rgba(43, 29, 20, .35) 0%, rgba(43, 29, 20, .12) 40%, rgba(43, 29, 20, 0) 70%); }
.inside-title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; z-index: 2; opacity: 0; color: #1B120B; }
.it-card { padding: 18px 30px; background: radial-gradient(ellipse at center, rgba(239, 226, 196, .97) 52%, rgba(239, 226, 196, 0) 72%); }
.inside-title .it-pre { font-family: var(--f-fell); font-style: italic; font-size: calc(var(--W) * .038); color: #5C4632; }
.inside-title h2 { margin: 0 0 2px; font-family: var(--f-script); font-weight: 400; font-size: calc(var(--W) * .15); line-height: 1.1; color: #1B120B; -webkit-text-fill-color: #1B120B;
  background: linear-gradient(180deg, #A9852B, #7A5A12 60%, #5A400C); -webkit-background-clip: text; background-clip: text; color: transparent; }
.inside-title .it-rule { width: 46%; height: 9px; margin: 2px 0; background: var(--underline-dark) center / 100% 100% no-repeat; opacity: .8; }
.inside-title p { margin: 4px 0 0; font-family: var(--f-fell); font-style: italic; font-size: calc(var(--W) * .042); }
.wand { position: relative; z-index: 4; width: 170px; height: 140px; display: grid; place-items: center; transition: opacity .6s; touch-action: none; cursor: grab; will-change: transform; }
.wand.held { cursor: grabbing; }
.fold-stage { cursor: pointer; }
.wand svg { width: 170px; height: 150px; overflow: visible; }
.wand-g { transform-origin: 150px 140px; transform-box: view-box; animation: hover 4s ease-in-out infinite; }
@keyframes hover { 0%, 100% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(0, -3px) rotate(-1deg); } }
.wand.held .wand-g, .wand.touch .wand-g { animation: none; }
.wand-tipglow { animation: lumos 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes lumos { 0%, 100% { opacity: .45; transform: scale(.85); } 50% { opacity: .9; transform: scale(1.1); } }
.wand.touch .wand-tipglow { animation: flare .9s ease-out forwards; }
@keyframes flare { 0% { opacity: .6; transform: scale(1); } 30% { opacity: 1; transform: scale(2.4); } 100% { opacity: .5; transform: scale(1); } }
.wand-label { position: absolute; bottom: -4px; left: 0; right: 0; text-align: center; font-family: var(--f-fell); font-style: italic; font-size: 14px; color: rgba(243, 233, 210, .5); }

/* ── Reduced motion: simple fades only ─────────────────────────────────── */
.rm .mote, .rm .hparticles, .rm .intro-particles { display: none; }
.rm .mk, .rm .mk.materialise { animation: fadeIn .35s ease both !important; }
.rm .mk::after { display: none; }
.rm .mk.dissolve { animation: fadeOut .3s ease both !important; }
.rm .mk.bounce { animation: none !important; }
.rm .mk.is-hl .mk-halo { animation: none; opacity: .8; }
.rm .step { animation: none; opacity: .55; }
.rm .star, .rm .wand-tipglow, .rm .wand-g, .rm .me-feet i, .rm .me-glow { animation: none; }
.rm .countdown.soon .cd-txt b { animation: none; color: var(--text); background: none; }
.rm .ink-l { animation: fadeFill .4s ease both !important; stroke-dashoffset: 0 !important; }
.rm .fpanel, .rm .mode-thumb, .rm .tab::after { transition-duration: .01s; }
.rm .ink-fill, .rm .nib { transition: none; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes fadeFill { from { fill-opacity: 0; } to { fill-opacity: 1; } }
</style>

      ? { size: r.size, per: 150, strokeDur: 950, delay: t, fill: '#1B120B', fixed: true, sound: true }
      : { size: r.size, font: 'IM Fell English', italic: true, per: 30, strokeDur: 420, delay: t, fill: '#1B120B', fixed: true }));
    t += r.script ? 1100 : 700;
  });
  await wait(end + 1500); if (introSkipped) return;
  // 3 — the map unfolds, one panel and then the other
  pf.style.opacity = '0'; wand.style.opacity = '0';
  await wait(800); if (introSkipped) return;
  const fm = $('#foldMap');
  $('.fp-left', fm).style.transitionDelay = '0ms'; $('.fp-right', fm).style.transitionDelay = '750ms';
  Sound.rustle(1.4, .11); setTimeout(() => Sound.rustle(1.3, .09), 750);
  fm.classList.add('open');
  await wait(2400); if (introSkipped) return;
  // 4 — ink fans into every corner: streets, buildings, our places, and footsteps
  const ink = $('#insideInk'), fr = fm.getBoundingClientRect();
  const cx = fr.width * .25 + lx * (fr.width * .5 / pr.width), cy = ly * (fr.height / pr.height); // where the wand touched
  ink.setAttribute('viewBox', `0 0 ${fr.width} ${fr.height}`);
  const net = { x: cx, y: cy, w: fr.width, h: fr.height, seed: 21, count: 9, depth: 5, step: 21, wiggle: .16, grid: true, speed: .12, width: .75, max: 260, blocks: 70, opacity: .5, join: 18, upward: .6 };
  const netEnd = inkNetwork(ink, net);
  inkPlaces(ink, fr.width, fr.height, cx, cy, net.speed);
  scratchFor(netEnd * .8);
  setTimeout(() => inkWalkers(ink, fr.width, fr.height, marauderNames(), net.segs), 1400);
  await wait(Math.min(netEnd, 3800)); if (introSkipped) return;
  $('#insideTitle').animate([{ opacity: 0, transform: 'scale(.97)' }, { opacity: 1, transform: 'none' }], { duration: 1200, easing: 'ease-out', fill: 'forwards' });
  await wait(2800); if (introSkipped) return;
  finishIntro(false);
}
async function quickIntro() {
  $('#wand').style.display = 'none'; $('#packetFace').style.display = 'none';
  const fm = $('#foldMap'); $$('.fpanel', fm).forEach(p => { p.style.transition = 'none'; }); fm.classList.add('open');
  $('#hint').style.display = 'none';
  const ink = $('#insideInk'), fr = fm.getBoundingClientRect();
  ink.setAttribute('viewBox', `0 0 ${fr.width} ${fr.height}`);
  inkNetwork(ink, { x: fr.width / 2, y: fr.height / 2, w: fr.width, h: fr.height, seed: 21, count: 8, depth: 4, step: 15, wiggle: .2, grid: true, speed: 1, width: .95, max: 300, blocks: 70, opacity: .72, instant: true });
  $('#insideTitle').style.opacity = '1';
  await wait(RM ? 200 : 700);
  if (introSkipped) return;
  if (RM) finishIntro(true); else { introFinished = true; store.set('introSeen', introKey()); await inkReveal(900); intro.remove(); onAppReady(); }
}
function startIntro() {
  setupIntroGeometry();
  motes($('#introParticles'), 16, { dur: 14, size: 6 });
  $('#skipIntro').addEventListener('click', () => { introSkipped = true; finishIntro(true); });
  const mode = params.get('intro');
  if (mode === 'skip') { introSkipped = true; intro.remove(); introFinished = true; onAppReady(); return; }
  const full = mode === 'full' || (mode !== 'quick' && store.get('introSeen', '') !== introKey());
  if (full) armWand(); else quickIntro();
}

/* ═════════════════════════ Boot ═════════════════════════ */
function onAppReady() {
  state.introDone = true;
  syncLayers(true, false);
  tick();
  setInterval(tick, 15000);
  WX.load(); loadAllWiki();
  DAYS.forEach(d => d.stops.forEach((s, k) => { if (k) Routes.want(d.stops[k - 1], s); }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); renderTabs(); updateTabs(); } });
}
rootStyle.setProperty('--accent', (curDay() && curDay().accentColour) || '#6B1E2A');
motes($('#hParticles'), 6, { dur: 9, size: 4, rise: 24 });
renderTabs(); renderProgressTicks(); updateTabs(); updateModeUI(); renderSheet(); updateCountdown();
Sheet.measure();
initMap();
let rz = 0;
const onResize = () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { Sheet.measure(); if (map) map.invalidateSize(); buildStepsSoon(); }); };
addEventListener('resize', onResize);
if (window.ResizeObserver) new ResizeObserver(onResize).observe(elHeader);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(onResize);
startIntro();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
});
</script>
