<style>
@property --accent { syntax: '<color>'; inherits: true; initial-value: #6B1E2A; }

:root {
  --parchment: #F3E9D2;
  --ink: #2B1D14;
  --gold: #C9A227;
  --burgundy: #6B1E2A;
  --green: #1F3B2C;
  --night: #120D0A;

  --paper: var(--parchment);
  --paper-2: #E9DAB6;
  --text: var(--ink);
  --text-soft: #5A4433;
  --line: rgba(43, 29, 20, .2);
  --line-strong: rgba(43, 29, 20, .38);
  --gold-ink: #7E5F0F;
  --seal: #8E1F2C;
  --step-ink: rgba(43, 29, 20, .78);
  --route: var(--accent);
  --tile-filter: sepia(.6) saturate(.8) hue-rotate(-8deg) contrast(.96) brightness(1.02);
  --tile-opacity: .86;
  --noise: none;
  --noise-l: none;
  --noise-d: none;
  --shadow: 0 6px 22px rgba(18, 13, 10, .28);

  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --header-h: 160px;
  --col: 440px;
  --col-left: max(0px, calc((100% - var(--col)) / 2));
  --col-w: min(100%, var(--col));

  --f-head: 'Cinzel Decorative', 'Cinzel', 'Trajan Pro', Georgia, serif;
  --f-fell: 'IM Fell English', 'EB Garamond', Georgia, serif;
  --f-body: 'EB Garamond', Garamond, Georgia, 'Times New Roman', serif;
  --f-hand: 'Homemade Apple', 'IM Fell English', cursive;

  --accent: #6B1E2A;
  transition: --accent .9s ease;
  --noise-current: var(--noise-l);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #2A1D14;
    --paper-2: #1F150E;
    --text: #F1E2BC;
    --text-soft: #CDB98E;
    --line: rgba(233, 203, 98, .22);
    --line-strong: rgba(233, 203, 98, .42);
    --gold-ink: #E2BE4A;
    --seal: #A3303F;
    --step-ink: rgba(240, 214, 140, .85);
    --route: color-mix(in srgb, var(--accent) 30%, #E9CB62);
    --tile-filter: sepia(.75) saturate(1.25) hue-rotate(-10deg) brightness(.95);
    --tile-opacity: .9;
    --noise-current: var(--noise-d);
    --shadow: 0 6px 22px rgba(0, 0, 0, .55);
  }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--night); }
body {
  font-family: var(--f-body); font-size: 17px; line-height: 1.45; color: var(--text);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
img { display: block; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.paper { background-color: var(--paper); background-image: var(--noise-current); }

/* ── App shell ─────────────────────────────────────────────────────────── */
#app { position: fixed; inset: 0; overflow: hidden; background: var(--paper); z-index: 1; }
#map.leaflet-container, #map {
  position: absolute; inset: 0; z-index: 0; isolation: isolate; font-family: var(--f-body);
  background-color: var(--paper);
  background-image:
    radial-gradient(ellipse 30% 22% at 22% 30%, rgba(140, 96, 40, .10), transparent 70%),
    radial-gradient(ellipse 26% 18% at 78% 68%, rgba(140, 96, 40, .09), transparent 70%),
    var(--noise-current);
}
#map .leaflet-tile-pane { filter: var(--tile-filter); opacity: var(--tile-opacity); }
.map-vignette {
  position: absolute; inset: 0; pointer-events: none; z-index: 5;
  background: radial-gradient(ellipse 85% 75% at 50% 50%, transparent 62%, rgba(70, 42, 16, .30) 100%);
}
.map-error { position: absolute; inset: 0; display: grid; place-items: center; padding: 32px; text-align: center; font-family: var(--f-fell); font-size: 19px; z-index: 6; }

.mapfx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }
.wash {
  position: absolute; top: 0; bottom: 0; left: 0; width: 300%;
  background: linear-gradient(90deg, transparent 0%, rgba(43, 22, 18, .9) 30%, rgba(18, 13, 10, .94) 50%, rgba(43, 22, 18, .9) 70%, transparent 100%);
  background: linear-gradient(90deg, transparent 0%, color-mix(in srgb, var(--accent) 55%, #120D0A) 30%, rgba(18, 13, 10, .94) 50%, color-mix(in srgb, var(--accent) 55%, #120D0A) 70%, transparent 100%);
  transform: translate3d(-100%, 0, 0); opacity: 0; will-change: transform;
}
.dust { position: absolute; left: 0; top: 0; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%;
  background: radial-gradient(circle, #FFF4C2 0%, #E9C54F 45%, rgba(201, 162, 39, 0) 72%); pointer-events: none; }

/* ── Header ────────────────────────────────────────────────────────────── */
.header {
  position: absolute; top: 0; left: var(--col-left); width: var(--col-w); z-index: 20;
  padding: calc(var(--safe-t) + 8px) calc(14px + var(--safe-r)) 8px calc(14px + var(--safe-l));
  box-shadow: var(--shadow);
  border-bottom: 1.5px solid rgba(201, 162, 39, .7);
}
.header::before { /* dark band behind the iPhone status bar */
  content: ''; position: absolute; left: 0; right: 0; top: 0; height: var(--safe-t);
  background: linear-gradient(180deg, #120D0A, #2B1D14); border-bottom: 1px solid rgba(201, 162, 39, .5);
}
@media (min-width: 520px) { .header { border-radius: 0 0 18px 18px; border: 1.5px solid rgba(201, 162, 39, .7); border-top: 0; } }
.hparticles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: inherit; }
.brand {
  position: relative; margin: 0; text-align: center; font-family: var(--f-head); font-weight: 700;
  font-size: 23px; line-height: 1.2; letter-spacing: .02em;
  background: linear-gradient(180deg, #F3D97C 0%, #C9A227 48%, #7E5F0F 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 1px 0 rgba(43, 29, 20, .45));
}
.daytitle { position: relative; margin-top: 1px; text-align: center; font-family: var(--f-fell); font-style: italic; font-size: 17px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.countdown {
  position: relative; display: flex; align-items: center; justify-content: center; gap: 6px;
  margin: 5px auto 0; max-width: 100%; min-height: 34px; padding: 4px 14px;
  border-radius: 999px; border: 1px solid var(--line-strong); overflow: hidden;
  font-size: 16px; line-height: 1.2; background: rgba(201, 162, 39, .10);
}
.countdown .cd-txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.countdown b { font-weight: 600; }
.countdown .cd-dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 6px var(--gold); }
.countdown.soon { border-color: var(--gold); }
.countdown.soon::after {
  content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 45%;
  background: linear-gradient(100deg, transparent, rgba(255, 236, 160, .65), transparent);
  transform: translate3d(-120%, 0, 0); animation: shimmer 2.2s ease-in-out infinite; pointer-events: none;
}
@keyframes shimmer { 0% { transform: translate3d(-120%, 0, 0); } 60%, 100% { transform: translate3d(330%, 0, 0); } }

.progress { position: relative; height: 12px; margin: 8px 4px 2px; }
.ink-track { position: absolute; left: 0; right: 0; top: 5px; height: 2px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--line-strong) 0 4px, transparent 4px 8px); }
.ink-fill {
  position: absolute; left: 0; right: 0; top: 4px; height: 4px; border-radius: 3px;
  background: linear-gradient(90deg, var(--text) 0%, var(--text) 70%, color-mix(in srgb, var(--text) 70%, transparent) 100%);
  transform-origin: 0 50%; transform: scaleX(0); transition: transform 1.2s cubic-bezier(.3, .7, .2, 1);
}
.ptick { position: absolute; top: 1px; width: 2px; height: 10px; margin-left: -1px; background: var(--gold); border-radius: 1px; }
.nib { position: absolute; top: -6px; left: 0; width: 18px; height: 18px; margin-left: -3px; transition: left 1.2s cubic-bezier(.3, .7, .2, 1); pointer-events: none; }

.tabs { position: relative; display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; padding: 6px 2px 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.tabs::-webkit-scrollbar { display: none; }
.tabs::before, .tabs::after { content: ''; flex: 1 0 0; }
.tab {
  flex: 0 0 auto; scroll-snap-align: center; min-height: 48px; min-width: 76px; padding: 4px 10px;
  border-radius: 999px; border: 1.5px solid var(--line-strong);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.12;
  transition: background-color .4s, border-color .4s, color .4s;
}
.tab-day { font-family: var(--f-fell); font-size: 17px; display: flex; align-items: center; gap: 3px; }
.tab-date { font-size: 13px; opacity: .85; }
.tab[aria-selected="true"] { background: var(--accent); color: #F8EED6; border-color: var(--gold); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14), 0 2px 8px rgba(0, 0, 0, .28); }
.star { color: #E9C54F; font-size: 14px; text-shadow: 0 0 6px #FFD56A, 0 0 12px #FFB800; animation: twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

/* ── Mode toggle ───────────────────────────────────────────────────────── */
.modes {
  position: absolute; z-index: 15; top: calc(var(--header-h) + 10px); left: 50%; transform: translateX(-50%);
  display: grid; grid-template-columns: repeat(3, 1fr); padding: 3px; border-radius: 999px; transition: opacity .3s;
  border: 1.5px solid var(--gold); box-shadow: var(--shadow); width: min(330px, calc(100% - 28px));
}
.card-open .modes { opacity: 0; pointer-events: none; }
.mode { position: relative; z-index: 1; min-height: 44px; font-family: var(--f-fell); font-size: 17px; border-radius: 999px; transition: color .35s; }
.mode[aria-checked="true"] { color: #F8EED6; }
.mode-thumb {
  position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3); border-radius: 999px;
  background: var(--accent); box-shadow: inset 0 0 0 1px rgba(233, 203, 98, .7), 0 1px 4px rgba(0, 0, 0, .3);
  transition: transform .45s cubic-bezier(.3, 1.3, .5, 1);
}

/* ── Bottom sheet ──────────────────────────────────────────────────────── */
.sheet {
  position: absolute; z-index: 18; left: var(--col-left); width: var(--col-w); bottom: 0; height: 70%;
  display: flex; flex-direction: column; border-radius: 20px 20px 0 0;
  box-shadow: 0 -8px 26px rgba(18, 13, 10, .32); border-top: 2px solid var(--gold);
  transform: translate3d(0, 100%, 0); will-change: transform;
}
.sheet::before { /* rolled scroll edge */
  content: ''; position: absolute; left: 10px; right: 10px; top: -7px; height: 12px; border-radius: 7px; z-index: 1; pointer-events: none;
  background: linear-gradient(180deg, #F7E7B8 0%, #D9BE79 45%, #9C7A3A 100%);
  box-shadow: 0 2px 4px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .5);
}
.sheet-float { position: absolute; left: 0; right: 0; top: -66px; height: 56px; pointer-events: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 calc(12px + var(--safe-r)) 0 calc(12px + var(--safe-l)); transition: opacity .3s; }
.sheet.is-full .sheet-float { opacity: 0; }
.sheet.is-full .sheet-float * { pointer-events: none !important; }
.attrib { pointer-events: auto; font-size: 11px; line-height: 1.2; color: var(--text); opacity: .8; padding: 2px 6px; border-radius: 6px; background: color-mix(in srgb, var(--paper) 80%, transparent); margin-bottom: 2px; }
.attrib a { text-decoration: none; }
.fabs { display: flex; gap: 10px; pointer-events: auto; }
.fab {
  width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #3A2A1C, #1B120C); color: #F1D67A;
  border: 2px solid var(--gold); box-shadow: 0 4px 12px rgba(0, 0, 0, .4), inset 0 0 0 2px rgba(0, 0, 0, .35);
}
.fab svg { width: 24px; height: 24px; }
.fab.is-on { box-shadow: 0 0 0 3px rgba(233, 197, 79, .35), 0 4px 12px rgba(0, 0, 0, .4); }
.sheet-grab { flex: 0 0 auto; touch-action: none; cursor: grab; padding: 8px calc(18px + var(--safe-r)) 8px calc(18px + var(--safe-l)); }
.sheet-grab:active { cursor: grabbing; }
.handle { width: 46px; height: 5px; border-radius: 3px; background: var(--line-strong); margin: 0 auto 8px; }
.sheet-head { display: flex; align-items: center; gap: 12px; min-height: 52px; }
.dnum { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; text-align: center; line-height: 1;
  background: var(--accent); color: #F8EED6; border: 2px solid var(--gold); font-family: var(--f-fell); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.dnum b { display: block; font-family: var(--f-head); font-size: 18px; letter-spacing: 0; }
.shead-t { min-width: 0; flex: 1; }
.shead-title { font-family: var(--f-fell); font-size: 19px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shead-sub { font-size: 15px; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-body {
  flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 2px calc(14px + var(--safe-r)) calc(var(--sheet-off, 0px) + 30px + var(--safe-b)) calc(14px + var(--safe-l));
}

/* ── Timeline ──────────────────────────────────────────────────────────── */
.sec-title { display: flex; align-items: center; gap: 10px; margin: 18px 4px 8px; font-family: var(--f-head); font-size: 15px; color: var(--gold-ink); letter-spacing: .04em; }
.sec-title::before, .sec-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl::before { /* gold thread */
  content: ''; position: absolute; left: 92px; top: 30px; bottom: 30px; width: 2px; margin-left: -1px;
  background: linear-gradient(180deg, #E9C54F, #9C7A12 50%, #E9C54F); border-radius: 1px; opacity: .85;
}
.tl-item {
  position: relative; display: grid; grid-template-columns: 50px 48px 1fr; gap: 10px; align-items: center; width: 100%;
  min-height: 64px; padding: 8px 8px 8px 0; border-radius: 14px; text-align: left; transition: background-color .4s, box-shadow .4s, opacity .4s;
}
.tl-time { font-family: var(--f-fell); font-size: 17px; text-align: right; }
.tl-node { position: relative; width: 48px; height: 48px; border-radius: 50%; z-index: 1; }
.tl-node .ph { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2.5px solid var(--gold); box-shadow: 0 0 0 1.5px var(--paper), 0 2px 5px rgba(0, 0, 0, .3); background: #2B1D14; }
.tl-node .num { position: absolute; right: -5px; bottom: -3px; width: 21px; height: 21px; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #F6E7C1; background: var(--seal-img) center/contain no-repeat; }
.tl-tick { position: absolute; left: -5px; top: -3px; width: 20px; height: 20px; border-radius: 50%; display: none; place-items: center; background: var(--green); color: #F1D67A; border: 1.5px solid var(--gold); }
.tl-tick svg { width: 12px; height: 12px; }
.tl-name { font-weight: 600; font-size: 18px; line-height: 1.2; }
.tl-act { font-size: 16px; line-height: 1.3; color: var(--text-soft); }
.tl-badge { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; vertical-align: 2px; background: var(--gold); color: #2B1D14; }
.tl-item.done { opacity: .55; }
.tl-item.done .tl-tick { display: grid; }
.tl-item.done .ph { filter: sepia(.8) saturate(.6); }
.tl-item.hl { background: radial-gradient(ellipse at 30% 50%, rgba(233, 197, 79, .26), rgba(233, 197, 79, .08) 70%); box-shadow: 0 0 0 1.5px rgba(201, 162, 39, .75), 0 0 18px rgba(233, 197, 79, .38); }
.tl-gap { display: flex; align-items: center; min-height: 26px; padding-left: 104px; font-family: var(--f-fell); font-style: italic; font-size: 15px; color: var(--text-soft); }

.mm-end { display: flex; align-items: center; gap: 12px; width: 100%; margin: 14px 0 4px; padding: 10px 14px; min-height: 56px; border-radius: 14px; border: 1px dashed var(--line-strong); text-align: left; }
.mm-end .seal-big { flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center; color: #F6E7C1; font-family: var(--f-head); font-size: 13px; background: var(--seal-img) center/contain no-repeat; }
.mm-end-t { font-family: var(--f-fell); font-style: italic; font-size: 17px; line-height: 1.25; }
.mm-end-t small { display: block; font-style: normal; font-family: var(--f-body); font-size: 14px; color: var(--text-soft); }

/* Train ticket */
.ticket {
  position: relative; margin: 6px 4px 14px; padding: 12px 18px 12px; color: #2B1D14;
  background-color: #F4E6C3; background-image: var(--noise-l), linear-gradient(135deg, rgba(255, 255, 255, .35), transparent 50%);
  border-radius: 6px; box-shadow: 0 3px 10px rgba(0, 0, 0, .25); transform: rotate(-.8deg);
  -webkit-mask: radial-gradient(circle 9px at 0 50%, transparent 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 9px at 100% 50%, transparent 98%, #000) right / 51% 100% no-repeat;
          mask: radial-gradient(circle 9px at 0 50%, transparent 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 9px at 100% 50%, transparent 98%, #000) right / 51% 100% no-repeat;
}
.ticket::before { content: ''; position: absolute; inset: 5px; border: 1.5px solid rgba(107, 30, 42, .55); border-radius: 3px; pointer-events: none; }
.tk-top { display: flex; justify-content: space-between; font-family: var(--f-head); font-size: 11px; letter-spacing: .12em; color: #6B1E2A; }
.tk-route { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0 2px; font-family: var(--f-head); font-size: 19px; line-height: 1.1; }
.tk-route span:nth-child(2) { font-family: var(--f-fell); color: #6B1E2A; font-size: 22px; }
.tk-stations { display: flex; justify-content: space-between; gap: 8px; font-style: italic; font-size: 14px; color: #5A4433; }
.tk-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1.5px dashed rgba(43, 29, 20, .35); text-align: center; }
.tk-row small { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #6B1E2A; }
.tk-row b { font-family: var(--f-fell); font-size: 20px; font-weight: 400; }
.tk-foot { margin-top: 6px; font-size: 13px; color: #5A4433; text-align: center; }
.ticket.done { opacity: .6; }

/* Where to eat */
.food-list { display: grid; gap: 10px; }
.food-item { display: grid; grid-template-columns: 58px 1fr; gap: 12px; align-items: center; width: 100%; min-height: 70px; padding: 8px 10px; border-radius: 14px; text-align: left; border: 1px solid var(--line); background: rgba(184, 115, 51, .08); }
.food-item .ph { width: 58px; height: 58px; border-radius: 50%; object-fit: cover; border: 2.5px solid #B87333; background: #2B1D14; }
.food-name { font-weight: 600; font-size: 18px; line-height: 1.2; }
.food-meta { font-size: 15px; color: var(--text-soft); }
.food-note { font-family: var(--f-fell); font-style: italic; font-size: 16px; line-height: 1.25; }
.chip { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #C97B1E; color: #FFF5E0; vertical-align: 1px; }
.empty-note { font-style: italic; color: var(--text-soft); text-align: center; padding: 10px; }
.sheet-attrib { margin-top: 26px; font-size: 13px; color: var(--text-soft); text-align: center; }

/* ── Monogram fallback for photos ─────────────────────────────────────── */
.mono { display: flex; align-items: center; justify-content: center; font-family: var(--f-head); font-weight: 700; color: #E9C54F; line-height: 1;
  background: radial-gradient(circle at 35% 30%, #4A3522, #1B120C 75%); text-shadow: 0 1px 0 #3B2A08, 0 0 10px rgba(233, 197, 79, .4); overflow: hidden; }
.tl-node .mono, .food-item .mono { font-size: 21px; }
.pin .mono { font-size: 20px; }
.card-photo .mono { font-size: 72px; }

/* ── Map markers ───────────────────────────────────────────────────────── */
.pin-wrap { background: none; border: 0; }
.pin { position: relative; width: 100%; height: 100%; animation: pinPop .6s cubic-bezier(.2, 1.5, .4, 1) both; animation-delay: var(--delay, 0ms); }
.pin-frame { position: absolute; inset: 6px; border-radius: 50%; overflow: hidden; background: #2B1D14; box-shadow: 0 3px 8px rgba(0, 0, 0, .45); }
.pin-frame .ph, .pin-frame .mono { width: 100%; height: 100%; object-fit: cover; }
.pin::before { content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: var(--frame-gold) center/contain no-repeat; }
.pin-food::before { background-image: var(--frame-copper); }
.seal { position: absolute; z-index: 3; right: -5px; bottom: -3px; width: 25px; height: 25px; display: grid; place-items: center;
  background: var(--seal-img) center/contain no-repeat; color: #F6E7C1; font-family: var(--f-fell); font-size: 14px; font-weight: 700; text-shadow: 0 1px 0 rgba(0, 0, 0, .45); }
.seal-food { background-image: var(--seal-amber); }
.seal-food svg { width: 13px; height: 13px; }
.pin-pulse { position: absolute; inset: -1px; border-radius: 50%; border: 3px solid #E9C54F; opacity: 0; z-index: 0; pointer-events: none; }
.pin.is-hl .pin-pulse { animation: pulse 2.2s ease-out infinite; }
.pin.is-hl .pin-pulse + .pin-pulse { animation-delay: 1.1s; }
@keyframes pulse { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(1.75); opacity: 0; } }
.pin.is-done .pin-frame { filter: sepia(.85) saturate(.55) brightness(.92); }
.pin-spark { position: absolute; left: 50%; top: 50%; width: 70px; height: 70px; margin: -35px; pointer-events: none; z-index: 4; opacity: 0;
  background: radial-gradient(circle, rgba(255, 246, 200, .95) 0 6%, rgba(255, 214, 106, .5) 14%, transparent 40%),
              conic-gradient(from 0deg, transparent 0 10%, rgba(255, 230, 150, .9) 12%, transparent 14% 35%, rgba(255, 230, 150, .9) 37%, transparent 39% 60%, rgba(255, 230, 150, .9) 62%, transparent 64% 85%, rgba(255, 230, 150, .9) 87%, transparent 89%);
  -webkit-mask: radial-gradient(circle, #000 30%, transparent 70%); mask: radial-gradient(circle, #000 30%, transparent 70%);
  animation: sparkPop .7s ease-out both; animation-delay: var(--delay, 0ms); }
@keyframes pinPop { 0% { transform: scale(0) rotate(-25deg); opacity: 0; } 55% { opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes sparkPop { 0% { transform: scale(.2) rotate(0); opacity: 0; } 25% { opacity: 1; } 100% { transform: scale(1.5) rotate(40deg); opacity: 0; } }
.pin.materialise { animation: pinMat .7s cubic-bezier(.2, 1.2, .4, 1) both; animation-delay: var(--delay, 0ms); }
@keyframes pinMat { 0% { transform: scale(.4) translateY(8px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.pin.dissolve { animation: pinDissolve .45s ease-in forwards !important; }
@keyframes pinDissolve { 0% { transform: none; opacity: 1; } 100% { transform: scale(.35) translateY(-10px); opacity: 0; } }
.pin.bounce { animation: pinBounce .6s cubic-bezier(.3, 1.6, .5, 1) both !important; }
@keyframes pinBounce { 0% { transform: scale(1); } 40% { transform: scale(1.25) translateY(-6px); } 100% { transform: none; } }

.pin-home { animation-name: pinPop; }
.pin-home .crest { position: absolute; inset: 0; background: var(--crest) center/contain no-repeat; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .45)); }
.pin-home::before { display: none; }

.route-main { stroke: var(--route); }
.route-ghost { stroke: var(--route); }
.route-bleed { stroke: var(--route); }
.route-fade { transition: opacity .4s ease !important; opacity: 0 !important; }

.step-wrap { background: none; border: 0; }
.step { position: absolute; left: -3px; top: -5px; width: 6px; height: 11px; opacity: 0; animation: stepFade var(--cycle, 4s) linear infinite; animation-delay: var(--d, 0ms); }
.step::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 7px; border-radius: 50% 50% 45% 45%; background: var(--step-ink); }
.step::after { content: ''; position: absolute; left: 1px; right: 1px; bottom: 0; height: 3px; border-radius: 50%; background: var(--step-ink); }
@keyframes stepFade { 0% { opacity: 0; } 3% { opacity: .95; } 28% { opacity: 0; } 100% { opacity: 0; } }

.me-wrap { background: none; border: 0; }
.me { position: absolute; left: 0; top: 0; }
.me-feet { position: absolute; left: -9px; top: -11px; width: 18px; height: 22px; transition: transform .3s ease-out; }
.me-feet i { position: absolute; top: 3px; width: 6px; height: 11px; animation: meStep 1.2s ease-in-out infinite; }
.me-feet i::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 7px; border-radius: 50% 50% 45% 45%; background: var(--ink); }
.me-feet i::after { content: ''; position: absolute; left: 1px; right: 1px; bottom: 0; height: 3px; border-radius: 50%; background: var(--ink); }
.me-feet i:first-child { left: 2px; top: 7px; }
.me-feet i:last-child { right: 2px; animation-delay: .6s; }
@keyframes meStep { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
.me-label {
  position: absolute; left: 0; top: 14px; transform: translateX(-50%); white-space: nowrap;
  font-family: var(--f-hand); font-size: 13px; line-height: 1; color: #2B1D14; padding: 7px 12px 4px;
  background: #F3E9D2; border: 1.2px solid #2B1D14; border-radius: 3px;
}
.me-label::before { content: ''; position: absolute; inset: -6px; border-radius: 10px; z-index: -1; box-shadow: 0 0 14px 6px rgba(255, 212, 100, .75); animation: meGlow 2.6s ease-in-out infinite; }
@keyframes meGlow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

/* ── Place card (parchment scroll) ─────────────────────────────────────── */
.card-layer { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
.card {
  position: absolute; pointer-events: auto; display: flex; flex-direction: column;
  left: calc(var(--col-left) + 10px + var(--safe-l)); width: calc(var(--col-w) - 20px - var(--safe-l) - var(--safe-r));
  bottom: calc(10px + var(--safe-b)); max-height: calc(100% - var(--header-h) - 150px - var(--safe-b));
  will-change: transform;

.rod { position: relative; z-index: 2; flex: 0 0 auto; height: 16px; margin: 0 -6px; border-radius: 8px;
  background: linear-gradient(180deg, #F7E3A0 0%, #C9A227 40%, #7E5F0F 100%); box-shadow: 0 3px 6px rgba(0, 0, 0, .35); }
.rod::before, .rod::after { content: ''; position: absolute; top: -3px; width: 14px; height: 22px; border-radius: 6px; background: linear-gradient(180deg, #5B3B1E, #2B1D14); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2); }
.rod::before { left: -8px; } .rod::after { right: -8px; }
.card-paper { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; margin: -8px 0; padding-top: 8px; padding-bottom: 8px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }
.card-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.card-photo { position: relative; height: clamp(120px, 21vh, 200px); margin: 0 10px; border-radius: 4px; overflow: hidden; background: #2B1D14; box-shadow: inset 0 0 0 2px var(--gold); }
.card-photo .ph, .card-photo .mono { width: 100%; height: 100%; object-fit: cover; }
.card-photo::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px #C9A227, inset 0 0 0 5px rgba(43, 29, 20, .5), inset 0 0 40px rgba(43, 29, 20, .45); pointer-events: none; }
.card-close { position: absolute; z-index: 3; top: 14px; right: 16px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(18, 13, 10, .72); color: #F1D67A; border: 1.5px solid var(--gold); }
.card-close svg { width: 18px; height: 18px; }
.card-content { padding: 12px 18px 6px; -webkit-user-select: text; user-select: text; }
.card-kicker { font-family: var(--f-head); font-size: 12px; letter-spacing: .08em; color: var(--gold-ink); }
.card-title { margin: 2px 0 2px; font-family: var(--f-fell); font-weight: 400; font-size: 27px; line-height: 1.12; }
.card-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 16px; color: var(--text-soft); }
.card-meta span { display: inline-flex; align-items: center; gap: 5px; }
.card-meta svg { width: 15px; height: 15px; }
.card-doing { margin: 10px 0 6px; padding: 8px 12px; border-left: 3px solid var(--accent); background: rgba(201, 162, 39, .1); border-radius: 0 8px 8px 0; font-size: 17px; line-height: 1.35; }
.card-doing small { display: block; font-family: var(--f-head); font-size: 11px; letter-spacing: .1em; color: var(--gold-ink); }
.card-desc { margin: 8px 0; font-size: 17px; line-height: 1.5; }
.card-booking { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0 4px; padding: 9px 12px; border-radius: 10px; border: 1px dashed var(--line-strong); font-size: 16px; line-height: 1.35; }
.card-booking .seal-mini { flex: 0 0 auto; width: 24px; height: 24px; background: var(--seal-img) center/contain no-repeat; }
.card-link { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 16px; color: var(--gold-ink); text-underline-offset: 3px; }
.card-status { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-family: var(--f-body); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; vertical-align: 3px; background: var(--gold); color: #2B1D14; }
.card-actions { flex: 0 0 auto; display: grid; grid-template-columns: 52px 1fr 52px; gap: 10px; padding: 10px 14px 6px; border-top: 1px solid var(--line); }
.nav-btn { height: 52px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--gold); color: var(--text); }
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn:disabled { opacity: .3; cursor: default; }
.portus-btn {
  position: relative; overflow: hidden; min-height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: radial-gradient(ellipse at 40% 30%, #8E2A38, #4E1019 80%); color: #F6DE8A; border: 1.5px solid #E9C54F;
  box-shadow: 0 3px 10px rgba(78, 16, 25, .5), inset 0 1px 0 rgba(255, 255, 255, .15);
  font-family: var(--f-head); font-size: 19px; letter-spacing: .06em;
}
.portus-btn small { font-family: var(--f-body); font-size: 13px; letter-spacing: 0; opacity: .85; }
.portus-btn svg { width: 22px; height: 22px; }

.vortex { position: fixed; inset: 0; z-index: 60; pointer-events: none; display: grid; place-items: center; }
.vortex-disc { width: 160vmax; height: 160vmax; border-radius: 50%; opacity: 0;
  background: repeating-conic-gradient(from 0deg, rgba(201, 162, 39, .0) 0deg 12deg, rgba(233, 197, 79, .55) 18deg, rgba(18, 13, 10, .0) 26deg 30deg),
              radial-gradient(circle, rgba(18, 13, 10, .95) 0 6%, rgba(43, 29, 20, .7) 22%, rgba(18, 13, 10, .0) 62%); }

/* ── Mischief Managed ──────────────────────────────────────────────────── */
.mischief { position: absolute; left: 0; right: 0; top: calc(var(--header-h) - 2px); bottom: 0; z-index: 30; perspective: 1600px; pointer-events: auto; }
.mm-panels { position: absolute; inset: 0; display: flex; }
.mm-panel { position: relative; flex: 1 1 0; height: 100%; background-color: var(--paper); background-image: var(--noise-current), linear-gradient(90deg, rgba(90, 60, 30, .10), transparent 20%, transparent 80%, rgba(90, 60, 30, .14)); -webkit-backface-visibility: visible; backface-visibility: visible; }
.mm-panel.l { transform-origin: 100% 50%; } .mm-panel.r { transform-origin: 0 50%; }
.mm-text { position: absolute; left: 0; right: 0; top: 38%; text-align: center; font-family: var(--f-fell); font-style: italic; font-size: clamp(34px, 10vw, 54px); color: var(--text); pointer-events: none; }
.mm-text span { display: inline-block; opacity: 0; }
.mm-text .sp { width: .3em; }
.mm-text.write span { animation: inkLetter .45s ease-out both; }
.mm-sub { position: absolute; left: 0; right: 0; top: calc(38% + 1.6em + 20px); text-align: center; font-family: var(--f-fell); font-size: 18px; color: var(--text-soft); opacity: 0; pointer-events: none; }
@keyframes inkLetter { 0% { opacity: 0; transform: translateY(6px) scale(.7) rotate(-8deg); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; } }

/* ── Toast ─────────────────────────────────────────────────────────────── */
.toast { position: absolute; z-index: 50; left: 50%; top: calc(var(--header-h) + 66px); max-width: min(90%, 380px); padding: 10px 16px; border-radius: 12px;
  background: #2B1D14; color: #F3E9D2; border: 1px solid var(--gold); font-size: 16px; text-align: center; box-shadow: var(--shadow);
  transform: translate(-50%, -8px); opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ── Sparkles (global) ─────────────────────────────────────────────────── */
#fx { position: fixed; inset: 0; z-index: 9999; pointer-events: none; overflow: hidden; }
.spark { position: absolute; left: 0; top: 0; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; pointer-events: none;
  background: radial-gradient(circle, #FFFBE6 0 20%, #FFD95E 45%, rgba(255, 196, 0, 0) 72%); border-radius: 50%; }
.spark.star { width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 0;
  background: radial-gradient(circle, #FFFBE6 0 12%, transparent 30%), conic-gradient(from 45deg, transparent 0 20%, #FFE38A 25%, transparent 30% 45%, #FFE38A 50%, transparent 55% 70%, #FFE38A 75%, transparent 80% 95%, #FFE38A 100%);
  -webkit-mask: radial-gradient(circle, #000 25%, transparent 70%); mask: radial-gradient(circle, #000 25%, transparent 70%); }

/* ── Candle particles ──────────────────────────────────────────────────── */
.mote { position: absolute; bottom: -10px; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255, 236, 170, .95) 0 25%, rgba(255, 180, 60, .45) 50%, rgba(255, 150, 0, 0) 72%);
  animation: moteRise var(--dur) linear infinite, moteFlicker 1.7s ease-in-out infinite alternate; animation-delay: var(--del), var(--del2); opacity: 0; }
@keyframes moteRise { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(var(--dx), var(--rise), 0); } }
@keyframes moteFlicker { 0% { opacity: .05; } 30% { opacity: var(--o); } 100% { opacity: calc(var(--o) * .4); } }

/* ── Opening (the reveal) ──────────────────────────────────────────────── */
#intro {
  position: fixed; inset: 0; z-index: 100; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
  background: radial-gradient(ellipse 70% 55% at 50% 45%, #2A1B10 0%, #170F0A 55%, #0A0705 100%); color: #F3E9D2;
  padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
}
.intro-particles { position: absolute; inset: 0; pointer-events: none; }
.skip { position: absolute; z-index: 5; top: calc(var(--safe-t) + 8px); right: calc(var(--safe-r) + 10px); min-width: 64px; min-height: 44px; padding: 0 14px;
  font-family: var(--f-fell); font-size: 17px; color: rgba(243, 233, 210, .75); text-decoration: underline; text-underline-offset: 4px; }
.fold-stage { position: relative; width: var(--W, 320px); height: calc(var(--W, 320px) * 1.1); transform: translateZ(0); }
.foldmap { position: absolute; inset: 0; perspective: 1400px; }
.fpanel { position: absolute; top: 0; bottom: 0; transform-style: preserve-3d; transition: transform .85s cubic-bezier(.55, .05, .25, 1); }
.fp-left { left: 0; width: 25%; transform-origin: 100% 50%; transform: rotateY(179.4deg); }
.fp-centre { left: 25%; width: 50%; }
.fp-right { left: 75%; width: 25%; transform-origin: 0 50%; transform: rotateY(-179deg); }
.foldmap.open .fp-left, .foldmap.open .fp-right { transform: rotateY(0deg); }
.face { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; background-color: #F3E9D2; background-image: var(--noise-l); }
.face.front { background-image: var(--inside-map), var(--noise-l); background-size: var(--W) calc(var(--W) * 1.1), auto; background-repeat: no-repeat, repeat; }
.fp-left .front { background-position: 0 0, 0 0; box-shadow: inset -18px 0 22px -16px rgba(90, 55, 20, .45), inset 0 0 0 1px rgba(90, 55, 20, .25); border-radius: 4px 0 0 4px; }
.fp-centre .front { background-position: calc(var(--W) * -.25) 0, 0 0; box-shadow: inset 18px 0 22px -16px rgba(90, 55, 20, .4), inset -18px 0 22px -16px rgba(90, 55, 20, .4), inset 0 0 0 1px rgba(90, 55, 20, .2); }
.fp-right .front { background-position: calc(var(--W) * -.75) 0, 0 0; box-shadow: inset 18px 0 22px -16px rgba(90, 55, 20, .45), inset 0 0 0 1px rgba(90, 55, 20, .25); border-radius: 0 4px 4px 0; }
.face.back { transform: rotateY(180deg); background-image: var(--noise-l), linear-gradient(90deg, #EBDDBA, #F3E9D2 40%, #E7D6AE); box-shadow: inset 0 0 0 1px rgba(90, 55, 20, .3), inset 0 0 30px rgba(120, 80, 30, .25); }
.foldmap::after { content: ''; position: absolute; left: 25%; right: 25%; top: 0; bottom: 0; box-shadow: 0 18px 40px rgba(0, 0, 0, .6); z-index: -1; transition: left .9s, right .9s; }
.foldmap.open::after { left: 0; right: 0; }
.packet-face { position: absolute; left: 25%; width: 50%; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #2B1D14; pointer-events: none; z-index: 3; transition: opacity .4s; }
.spell { height: 1.4em; font-family: var(--f-fell); font-style: italic; font-size: calc(var(--W) * .088); white-space: nowrap; filter: drop-shadow(0 0 6px rgba(255, 200, 80, .7)); }
.spell span { display: inline-block; opacity: 0; background: linear-gradient(180deg, #F3D97C, #C9A227 55%, #8A6A12); -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 .02em; }
.spell.write span { animation: inkLetter .5s ease-out both; }
.hint { margin: 10px 8px 0; font-family: var(--f-fell); font-style: italic; font-size: 16px; color: rgba(43, 29, 20, .5); transition: opacity .4s; }
.packet-seal { position: absolute; bottom: 14%; left: 50%; width: 46px; height: 46px; margin-left: -23px; display: grid; place-items: center; font-family: var(--f-head); font-size: 14px; color: #F6E7C1; background: var(--seal-img) center/contain no-repeat; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35)); transition: transform .4s, opacity .4s; }
.inside-title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; z-index: 2; opacity: 0; }
.inside-title h2 { margin: 0; font-family: var(--f-head); font-weight: 700; font-size: calc(var(--W) * .085); line-height: 1.15;
  background: linear-gradient(180deg, #E8C860, #A07C12 60%, #6E520C); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 1px 0 rgba(43, 29, 20, .4)); }
.inside-title p { margin: 8px 0 0; font-family: var(--f-fell); font-style: italic; font-size: 16px; color: #2B1D14; }
.wand { position: relative; z-index: 4; width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; transition: opacity .4s, transform .4s;
  background: radial-gradient(circle, rgba(255, 200, 90, .16), rgba(255, 200, 90, 0) 70%); }
.wand svg { width: 96px; height: 96px; overflow: visible; }
.wand-tipglow { animation: wandGlow 1.8s ease-in-out infinite; transform-origin: 94px 26px; }
@keyframes wandGlow { 0%, 100% { opacity: .55; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
.wand-label { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-family: var(--f-fell); font-size: 14px; color: rgba(243, 233, 210, .55); }
.wand.flick svg { animation: flick .45s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes flick { 0% { transform: rotate(0); } 40% { transform: rotate(-16deg); } 100% { transform: rotate(0); } }
.intro-fading { transition: opacity .35s ease; opacity: 0; }

/* ── Reduced motion: simple fades only ─────────────────────────────────── */
.rm .mote, .rm .hparticles, .rm .intro-particles { display: none; }
.rm .pin, .rm .pin.materialise, .rm .pin-home { animation: fadeIn .35s ease both !important; }
.rm .pin.dissolve { animation: fadeOut .3s ease both !important; }
.rm .pin.bounce { animation: none !important; }
.rm .pin-spark { display: none; }
.rm .pin.is-hl .pin-pulse { animation: none; opacity: .9; transform: scale(1.12); }
.rm .step { animation: none; opacity: .55; }
.rm .star, .rm .wand-tipglow, .rm .me-feet i, .rm .me-label::before { animation: none; }
.rm .countdown.soon::after { display: none; }
.rm .spell.write span, .rm .mm-text.write span { animation: fadeIn .4s ease both; }
.rm .fpanel, .rm .mode-thumb { transition-duration: .01s; }
.rm .ink-fill, .rm .nib { transition: none; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
</style>

<body>

<div id="app">
  <div id="map" aria-label="Enchanted map"></div>
  <div class="map-vignette"></div>
  <div class="mapfx" id="mapfx"><div class="wash" id="wash"></div></div>

  <header class="header paper" id="header">
    <div class="hparticles" id="hParticles"></div>
    <h1 class="brand">Aparecium Portus</h1>
    <div class="daytitle" id="dayTitle"></div>
    <button class="countdown" id="countdown" type="button"><span class="cd-dot"></span><span class="cd-txt" id="cdText">Revealing…</span></button>

    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Days"></nav>
  </header>

    <button class="mode" type="button" role="radio" data-mode="itinerary">Itinerary</button>
    <button class="mode" type="button" role="radio" data-mode="food">Food</button>
    <button class="mode" type="button" role="radio" data-mode="both">Both</button>
  </div>

  <section class="sheet paper" id="sheet" aria-label="The day's timeline">
    <div class="sheet-float">
      <div class="attrib">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a></div>
      <div class="fabs">
        <button class="fab" id="fabLocate" type="button" aria-label="Locate me" title="Locate me">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>
        </button>
        <button class="fab" id="fabHome" type="button" aria-label="Home base" title="Home base">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.6 8.5-8 10-4.4-1.5-8-5-8-10v-6z"/><path d="M8 13.5l4-3.5 4 3.5V17h-3v-2.5h-2V17H8z" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </div>

      <div class="handle"></div>
      <div class="sheet-head" id="sheetHead"></div>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="card-layer" id="cardLayer" hidden>
    <article class="card" id="card" role="dialog" aria-labelledby="cardTitle">
      <div class="rod rod-top"></div>
      <div class="card-paper paper" id="cardPaper">
        <button class="card-close" id="cardClose" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
        <div class="card-scroll" id="cardScroll"></div>
        <div class="card-actions">
          <button class="nav-btn" id="cardPrev" type="button" aria-label="Previous stop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button class="portus-btn" id="cardPortus" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 12m-1 0a1 1 0 1 0 2 0a3 3 0 1 0-6 0a5 5 0 1 0 10 0a7 7 0 1 0-14 0a9 9 0 0 0 9 9"/></svg>
            <span>Portus</span><small>directions</small>
          </button>
          <button class="nav-btn" id="cardNext" type="button" aria-label="Next stop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
      </div>
      <div class="rod rod-bottom" id="rodBottom"></div>
    </article>
  </div>

  <div class="mischief" id="mischief" hidden aria-live="polite">
    <div class="mm-panels"><div class="mm-panel l"></div><div class="mm-panel c"></div><div class="mm-panel r"></div></div>

    <div class="mm-sub" id="mmSub"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<div id="intro" aria-label="Opening">
  <div class="intro-particles" id="introParticles"></div>
  <button class="skip" id="skipIntro" type="button">Skip</button>
  <div class="fold-stage" id="foldStage">
    <div class="foldmap" id="foldMap">
      <div class="fpanel fp-centre"><div class="face front"></div></div>
      <div class="fpanel fp-left"><div class="face front"></div><div class="face back"></div></div>
      <div class="fpanel fp-right"><div class="face front"></div><div class="face back"></div></div>
      <div class="inside-title" id="insideTitle"><h2>Aparecium<br>Portus</h2><p id="insideSub"></p></div>
    </div>
    <div class="packet-face" id="packetFace">
      <div class="spell" id="spell" aria-label="Aparecium"></div>
      <p class="hint" id="hint">Tap your wand to reveal</p>
      <span class="packet-seal" id="packetSeal">AP</span>
    </div>
  </div>
  <button class="wand" id="wand" type="button" aria-label="Tap your wand to reveal the map">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="wandWood" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2A1A10"/><stop offset=".55" stop-color="#7A5634"/><stop offset="1" stop-color="#3B2616"/></linearGradient>
        <radialGradient id="wandTip"><stop offset="0" stop-color="#FFF8DC"/><stop offset=".35" stop-color="#FFD76A"/><stop offset="1" stop-color="#FFB000" stop-opacity="0"/></radialGradient>
      </defs>
      <circle class="wand-tipglow" cx="94" cy="26" r="24" fill="url(#wandTip)"/>
      <path d="M20 102 L93 27" stroke="url(#wandWood)" stroke-width="6" stroke-linecap="round"/>
      <path d="M20 102 L42 80" stroke="#1A0F08" stroke-width="10" stroke-linecap="round"/>
      <path d="M26 96 l4 4 M32 90 l4 4 M38 84 l4 4" stroke="#7A5634" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="44" cy="78" r="5.5" fill="#4A2F1A" stroke="#1A0F08" stroke-width="1.2"/>

      a = app.animate([0, .06, .22, .5, 1].map((f, i) => ({ clipPath: blob(w / 2, h / 2, maxR * f, i * 1.1) })), { duration: dur, easing: 'cubic-bezier(.45,.05,.25,1)', fill: 'both' });
    } catch (e) { a = null; }
    const done = () => { app.style.zIndex = ''; if (a) a.cancel(); resolve(); };
    if (a) a.onfinish = done; else { app.animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur }).onfinish = done; }
  });
}
let introSkipped = false, introFinished = false;
async function finishIntro(fast) {
  if (introFinished) return; introFinished = true;
  store.set('introDate', zonedDate(nowMs()));
  if (fast || RM) {
    app.style.zIndex = '200';
    await new Promise(r => { app.animate([{ opacity: 0 }, { opacity: 1 }], { duration: RM ? 400 : 350, easing: 'ease' }).onfinish = r; });
    app.style.zIndex = '';
  } else await inkReveal(1000);
  intro.remove();
  onAppReady();
}
function setupIntroGeometry() {
  const W = Math.round(Math.min(innerWidth * .86, 400, (innerHeight * .6) / 1.1));
  $('#foldStage').style.setProperty('--W', W + 'px');
  $('#foldStage').closest('#intro').style.setProperty('--W', W + 'px');
  $('#insideSub').textContent = `${T.city || ''} · ${DAYS.length ? fmtDate(DAYS[0].date, { day: 'numeric', month: 'short' }) + ' – ' + fmtDate(DAYS[DAYS.length - 1].date, { day: 'numeric', month: 'short', year: 'numeric' }) : ''}`;
}
async function fullIntro() {
  const wand = $('#wand'); if (introSkipped) return;
  wand.disabled = true;
  wand.classList.add('flick');
  const tip = wand.getBoundingClientRect(); const tx = tip.left + tip.width * (94 / 120), ty = tip.top + tip.height * (26 / 120);
  sparkle(tx, ty, 26, 80); setTimeout(() => sparkle(tx, ty, 14, 50), 120);
  $('#hint').style.opacity = '0';
  if (RM) { finishIntro(true); return; }
  await wait(350); if (introSkipped) return;
  const spell = $('#spell'); writeLetters(spell, 'Aparecium', 115);
  const rects = () => $$('span', spell).map(s => s.getBoundingClientRect());
  setTimeout(() => rects().forEach((r, i) => setTimeout(() => !introSkipped && sparkle(r.left + r.width * .7, r.top + r.height * .55, 3, 16), i * 115 + 120)), 30);
  await wait(9 * 115 + 650); if (introSkipped) return;
  wand.style.opacity = '0';
  const seal = $('#packetSeal'); seal.style.transform = 'scale(1.35)'; seal.style.opacity = '0';
  const sr = seal.getBoundingClientRect(); sparkle(sr.left + sr.width / 2, sr.top + sr.height / 2, 10, 40);
  $('#packetFace').style.opacity = '0';
  await wait(250); if (introSkipped) return;
  const fm = $('#foldMap');
  $('.fp-left', fm).style.transitionDelay = '0ms'; $('.fp-right', fm).style.transitionDelay = '280ms';
  fm.classList.add('open');
  await wait(1150); if (introSkipped) return;
  const it = $('#insideTitle');
  it.animate([{ opacity: 0, transform: 'scale(.92)', filter: 'blur(3px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 650, easing: 'ease-out', fill: 'forwards' });
  const ir = it.getBoundingClientRect(); sparkle(ir.left + ir.width / 2, ir.top + ir.height / 2, 18, 110);
  await wait(950); if (introSkipped) return;
  finishIntro(false);
}
async function quickIntro() {
  $('#wand').style.display = 'none'; $('#packetFace').style.display = 'none';
  const fm = $('#foldMap'); $$('.fpanel', fm).forEach(p => { p.style.transition = 'none'; }); fm.classList.add('open');
  $('#insideTitle').style.opacity = '1';
  await wait(RM ? 200 : 300);
  if (introSkipped) return;
  if (RM) finishIntro(true); else { introFinished = true; store.set('introDate', zonedDate(nowMs())); await inkReveal(700); intro.remove(); onAppReady(); }
}
function startIntro() {
  setupIntroGeometry();
  motes($('#introParticles'), 26, { dur: 11, size: 6 });
  $('#skipIntro').addEventListener('click', () => { introSkipped = true; finishIntro(true); });
  const mode = params.get('intro');
  if (mode === 'skip') { introSkipped = true; intro.remove(); introFinished = true; onAppReady(); return; }
  const full = mode === 'full' || (mode !== 'quick' && store.get('introDate', '') !== zonedDate(nowMs()));
  if (full) $('#wand').addEventListener('click', fullIntro, { once: true });
  else quickIntro();
}

/* ═════════════════════════ Boot ═════════════════════════ */
function onAppReady() {
  state.introDone = true;
  syncLayers(true, false);
  tick();
  setInterval(tick, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); renderTabs(); updateTabs(); } });
}
rootStyle.setProperty('--accent', (curDay() && curDay().accentColour) || '#6B1E2A');
motes($('#hParticles'), 9, { dur: 7, size: 4, rise: 24 });
renderTabs(); renderProgressTicks(); updateTabs(); updateModeUI(); renderSheet(); updateCountdown();
Sheet.measure();
initMap();
let rz = 0;
const onResize = () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { Sheet.measure(); if (map) map.invalidateSize(); if (stepTimer === 'on') buildSteps(); }); };
addEventListener('resize', onResize);
if (window.ResizeObserver) new ResizeObserver(onResize).observe(elHeader);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(onResize);
startIntro();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
});
</script>
