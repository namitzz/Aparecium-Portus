<style>

.sheet { position: absolute; z-index: 18; left: var(--col-left); width: var(--col-w); bottom: 0; height: 70%;

.tl-gap { display: flex; align-items: center; min-height: 26px; padding-left: 104px; font-family: var(--f-fell); font-style: italic; font-size: 15px; color: var(--text-soft); }

.mm-end { display: flex; align-items: center; gap: 12px; width: 100%; margin: 16px 0 4px; padding: 10px 14px; min-height: 56px; border-radius: 4px; border: 1px solid var(--rule); text-align: left; }
.mm-end .seal-big { flex: 0 0 auto; width: 36px; height: 36px; display: grid; place-items: center; color: #F1DFC0; font-family: var(--f-sc); font-size: 12px; background: var(--seal-img) center/contain no-repeat; }
.mm-end-t { font-family: var(--f-script); font-size: 25px; line-height: 1.1; color: var(--text); }
.mm-end-t small { display: block; font-family: var(--f-body); font-size: 14px; color: var(--text-soft); font-style: italic; }

/* Edmondson-style card ticket */
.ticket { position: relative; margin: 4px 4px 16px; padding: 12px 18px; color: #2B1D14; border-radius: 3px;
  background-color: #EFE1BD; background-image: var(--fibres), linear-gradient(160deg, rgba(255, 255, 255, .3), transparent 50%);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .22), inset 0 0 0 1px rgba(90, 60, 30, .25); }
.ticket::before { content: ''; position: absolute; inset: 5px; border: 1px solid rgba(43, 29, 20, .35); pointer-events: none; }
.ticket::after { content: ''; position: absolute; right: 22px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .35); }
.tk-top { display: flex; justify-content: space-between; font-family: var(--f-sc); font-size: 12px; letter-spacing: .14em; color: #6B1E2A; }
.tk-route { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 6px 22px 0 0; font-family: var(--f-sc); font-size: 21px; line-height: 1.1; }
.tk-route i { font-family: var(--f-fell); font-size: 15px; color: #6B1E2A; }
.tk-stations { display: flex; justify-content: space-between; gap: 8px; margin-right: 22px; font-style: italic; font-size: 14px; color: #5A4433; }
.tk-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 22px 0 0; padding-top: 7px; border-top: 1px dashed rgba(43, 29, 20, .4); text-align: center; }
.tk-row small { display: block; font-family: var(--f-sc); font-size: 11px; letter-spacing: .12em; color: #6B1E2A; }
.tk-row b { font-family: var(--f-fell); font-size: 20px; font-weight: 400; }
.tk-foot { margin-top: 5px; font-size: 13px; color: #5A4433; text-align: center; font-style: italic; }
.ticket.done { opacity: .6; }

.food-list { display: grid; gap: 8px; }
.food-item { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; width: 100%; min-height: 70px; padding: 9px 10px; border-radius: 4px; text-align: left; border: 1px solid var(--rule); }
.food-item .ph, .food-item .mono { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 1px var(--text), 0 0 0 3px var(--paper), 0 0 0 4px #A86A2C; }
.food-item .ph { filter: sepia(.2); }
.food-name { font-weight: 600; font-size: 18px; line-height: 1.2; }
.food-meta { font-size: 15px; color: var(--text-soft); }
.food-note { font-family: var(--f-fell); font-style: italic; font-size: 16px; line-height: 1.25; }
.chip { display: inline-block; padding: 0 6px; border: 1px solid #A86A2C; border-radius: 3px; font-size: 13px; color: #A86A2C; vertical-align: 1px; }
.empty-note { font-style: italic; color: var(--text-soft); text-align: center; padding: 10px; }
.sheet-attrib { margin-top: 26px; font-size: 13px; color: var(--text-soft); text-align: center; font-style: italic; }

/* ── Illuminated initial (when there's no photo) ──────────────────────── */
.mono { display: flex; align-items: center; justify-content: center; font-family: var(--f-sc); color: #6B1E2A; line-height: 1; overflow: hidden;
  background: radial-gradient(circle at 50% 40%, #F5ECD6, #E2CFA4 80%); text-shadow: 0 1px 0 rgba(255, 255, 255, .5); }
.tl-node .mono, .food-item .mono { font-size: 24px; }
.mk .mono { font-size: 21px; }
.card-photo .mono { font-size: 96px; background: radial-gradient(ellipse at 50% 45%, #F5ECD6, #DCC697 85%); }
/* ── Map markers ───────────────────────────────────────────────────────── */
.mk-wrap { background: none; border: 0; }
.mk { position: relative; width: 100%; height: 100%; animation: inkIn .7s cubic-bezier(.25, .8, .3, 1) both; animation-delay: var(--delay, 0ms); }
.mk::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 1.5px solid var(--step-ink); opacity: 0; pointer-events: none;
  animation: inkRing .9s ease-out both; animation-delay: var(--delay, 0ms); }
@keyframes inkIn { 0% { opacity: 0; transform: scale(.82); } 100% { opacity: 1; transform: none; } }
@keyframes inkRing { 0% { opacity: .7; transform: scale(.6); } 100% { opacity: 0; transform: scale(1.6); } }
.mk-medal { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: var(--paper-2);
  box-shadow: 0 0 0 1.25px #2B1D14, 0 0 0 3.5px #EFE2C2, 0 0 0 4.5px #8A6A1C, 0 5px 12px rgba(30, 18, 8, .38); }
.mk-medal .ph, .mk-medal .mono { width: 100%; height: 100%; object-fit: cover; }
.mk-medal .ph { filter: sepia(.3) contrast(1.05); }
.mk-num { position: absolute; z-index: 2; left: -7px; top: -6px; width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center;
  background: #F3E9D2; color: #2B1D14; border: 1.2px solid #2B1D14; font: 600 12.5px/1 var(--f-body); font-variant-numeric: lining-nums; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.mk-label { position: absolute; z-index: 1; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
  font-family: var(--f-fell); font-style: italic; font-size: 14px; line-height: 1; color: var(--text); padding: 4px 13px 3px; background: var(--label-bg);
  border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong);
  clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 50%, 100% 100%, 0 100%, 6px 50%); transition: opacity .3s; }
.mk-halo { position: absolute; inset: -16px; border-radius: 50%; opacity: 0; pointer-events: none;
  background: radial-gradient(circle, rgba(233, 199, 97, .6) 0%, rgba(233, 199, 97, .25) 45%, rgba(233, 199, 97, 0) 70%); }
.mk.is-hl .mk-halo { animation: breathe 3s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: .45; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
.mk.is-hl .mk-num { background: #2B1D14; color: #F1D88A; border-color: #8A6A1C; }
.mk.is-done .mk-medal { filter: grayscale(.85) opacity(.72); }
.mk.is-done .mk-num { background: #2B1D14; color: #F3E9D2; }
.zoom-far .mk:not(.is-hl) .mk-label, .zoom-mid .mk:not(.is-hl) .mk-label { opacity: 0; }
.mk-food .mk-medal { box-shadow: 0 0 0 1.25px #2B1D14, 0 0 0 3.5px #EFE2C2, 0 0 0 4.5px #A86A2C, 0 4px 10px rgba(30, 18, 8, .35); }
.mk-food .mk-fork { position: absolute; z-index: 2; right: -6px; bottom: -5px; width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; background: #F3E9D2; border: 1.2px solid #A86A2C; color: #8A4E18; }
.mk-food .mk-fork svg { width: 11px; height: 11px; }
.mk-food .mk-label { color: #8A4E18; }
.mk-home .crest { position: absolute; inset: 0; background: var(--crest) center/contain no-repeat; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .4)); }
.mk-home::after { display: none; }
.mk.materialise { animation: inkIn .8s ease-out both; animation-delay: var(--delay, 0ms); }
.mk.dissolve { animation: dissolve .45s ease-in forwards !important; }
@keyframes dissolve { to { opacity: 0; transform: scale(.7); } }
.mk.bounce { animation: lift .7s cubic-bezier(.3, 1.4, .5, 1) both !important; }
@keyframes lift { 0% { transform: none; } 40% { transform: translateY(-7px) scale(1.08); } 100% { transform: none; } }
.route-main, .route-ghost, .route-bleed { stroke: var(--route); }
.route-fade { transition: opacity .4s ease !important; opacity: 0 !important; }

.step-wrap { background: none; border: 0; }
.walker { position: absolute; left: 0; top: 0; transform: translate(-50%, 9px); white-space: nowrap; font-family: var(--f-fell); font-style: italic; font-size: 12.5px; line-height: 1; color: var(--text); padding: 3px 11px 2px; background: var(--label-bg); border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong); clip-path: polygon(0 0, 100% 0, calc(100% - 5px) 50%, 100% 100%, 0 100%, 5px 50%); transition: opacity .4s; }
.walker::before { content: ''; }
.walker-dot { position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%; background: var(--step-ink); }
.rm .walker-wrap { display: none; }
.step { position: absolute; left: -3.5px; top: -7px; width: 7px; height: 14px; opacity: 0; color: var(--step-ink); animation: stepFade var(--cycle, 4s) linear infinite; animation-delay: var(--d, 0ms); }
.step svg { display: block; width: 7px; height: 14px; }
@keyframes stepFade { 0% { opacity: 0; } 3% { opacity: .95; } 30% { opacity: 0; } 100% { opacity: 0; } }

.me-wrap { background: none; border: 0; }
.me { position: absolute; left: 0; top: 0; }
.me-feet { position: absolute; left: -10px; top: -12px; width: 20px; height: 24px; transition: transform .3s ease-out; color: var(--text); }
.me-feet i { position: absolute; top: 2px; width: 7px; height: 14px; animation: meStep 1.3s ease-in-out infinite; }
.me-feet i svg { display: block; width: 7px; height: 14px; }
.me-feet i:first-child { left: 2px; top: 8px; }
.me-feet i:last-child { right: 2px; animation-delay: .65s; }
@keyframes meStep { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
.me-label { position: absolute; left: 0; top: 16px; transform: translateX(-50%); white-space: nowrap; font-family: var(--f-fell); font-style: italic; font-size: 14px; line-height: 1;
  color: #2B1D14; padding: 5px 14px 4px; background: #F3E9D2; border-top: 1px solid #2B1D14; border-bottom: 1px solid #2B1D14;
  clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 50%, 100% 100%, 0 100%, 6px 50%); }
.me-glow { position: absolute; left: -50px; top: -30px; width: 100px; height: 80px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(ellipse, rgba(255, 214, 120, .55), rgba(255, 214, 120, 0) 65%); animation: breathe 3s ease-in-out infinite; }

/* ── Place card ────────────────────────────────────────────────────────── */
.card-layer { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
.card { position: absolute; pointer-events: auto; display: flex; flex-direction: column;
  left: calc(var(--col-left) + 10px + var(--safe-l)); width: calc(var(--col-w) - 20px - var(--safe-l) - var(--safe-r));
  bottom: calc(10px + var(--safe-b)); max-height: calc(100% - var(--header-h) - 150px - var(--safe-b)); will-change: transform; }
.rod { position: relative; z-index: 2; flex: 0 0 auto; height: 13px; margin: 0 -5px; border-radius: 7px;
  background: linear-gradient(180deg, #F4E8C8 0%, #D8C08A 45%, #9E8250 100%); box-shadow: 0 2px 5px rgba(0, 0, 0, .3); }
.card-paper { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; margin: -7px 0; padding: 7px 0;
  box-shadow: 0 12px 32px rgba(0, 0, 0, .4), inset 0 0 40px rgba(110, 72, 30, .18); }
.card-paper::before { content: ''; position: absolute; inset: 12px 7px 7px; border: 1px solid var(--rule); pointer-events: none; z-index: 1; }
.card-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.card-photo { position: relative; height: clamp(120px, 21vh, 200px); margin: 12px 12px 0; overflow: hidden; background: var(--paper-2); }
.card-photo .ph, .card-photo .mono { width: 100%; height: 100%; object-fit: cover; }
.card-photo .ph { filter: sepia(.18) contrast(1.03); }
.card-photo::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px rgba(43, 29, 20, .6), inset 0 0 50px rgba(43, 29, 20, .35); pointer-events: none; }
.card-close { position: absolute; z-index: 3; top: 16px; right: 16px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(243, 233, 210, .9); color: #2B1D14; border: 1px solid rgba(43, 29, 20, .5); }
.card-close svg { width: 16px; height: 16px; }
.card-content { padding: 12px 20px 6px; -webkit-user-select: text; user-select: text; }
.card-kicker { font-family: var(--f-sc); font-size: 14px; letter-spacing: .08em; color: var(--gold-ink); }
.card-title { margin: 2px 0; font-family: var(--f-fell); font-weight: 400; font-size: 28px; line-height: 1.1; }
.card-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 16px; color: var(--text-soft); font-style: italic; }
.card-meta span { display: inline-flex; align-items: center; gap: 5px; }
.card-meta svg { width: 15px; height: 15px; }
.card-meta s { opacity: .7; }
.card-doing { margin: 12px 0 8px; padding: 2px 0 2px 12px; border-left: 2px solid var(--accent-ink); font-size: 17px; line-height: 1.35; }
.card-doing small { display: block; font-family: var(--f-sc); font-size: 13px; letter-spacing: .08em; color: var(--gold-ink); }
.card-desc { margin: 8px 0; font-size: 17px; line-height: 1.5; }
.card-desc::first-letter { font-family: var(--f-sc); font-size: 2.3em; float: left; line-height: .9; padding: 4px 6px 0 0; color: var(--accent-ink); }
.card-booking { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0 4px; padding: 9px 12px; border-radius: 3px; background: rgba(110, 72, 30, .07); font-size: 16px; line-height: 1.35; }
.card-booking .seal-mini { flex: 0 0 auto; width: 22px; height: 22px; background: var(--seal-img) center/contain no-repeat; }
.card-link { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 16px; color: var(--gold-ink); text-underline-offset: 3px; font-style: italic; }
.card-status { display: inline-block; margin-left: 8px; padding: 1px 6px; border: 1px solid var(--accent-ink); border-radius: 3px; font-family: var(--f-sc); font-size: 13px; letter-spacing: .06em; color: var(--accent-ink); vertical-align: 5px; }
.card-actions { flex: 0 0 auto; display: grid; grid-template-columns: 50px 1fr 50px; gap: 10px; padding: 10px 14px 8px; border-top: 1px solid var(--rule); position: relative; z-index: 2; }
.nav-btn { height: 50px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--rule-strong); color: var(--text); }
.nav-btn svg { width: 20px; height: 20px; }
.nav-btn:disabled { opacity: .25; cursor: default; }
.portus-btn { position: relative; overflow: hidden; min-height: 50px; border-radius: 4px; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: #2B1D14; color: #E8CC7A; border: 1px solid #8A6A1C; box-shadow: inset 0 0 0 3px #2B1D14, inset 0 0 0 4px rgba(226, 194, 106, .35), 0 3px 10px rgba(0, 0, 0, .3);
  font-family: var(--f-sc); font-size: 19px; letter-spacing: .14em; }
.portus-btn small { font-family: var(--f-fell); font-style: italic; font-size: 14px; letter-spacing: 0; opacity: .8; }
.portus-btn svg { width: 20px; height: 20px; }

.vortex { position: fixed; inset: 0; z-index: 60; pointer-events: none; display: grid; place-items: center; }
.vortex-disc { width: 160vmax; height: 160vmax; border-radius: 50%; opacity: 0;
  background: repeating-conic-gradient(from 0deg, rgba(43, 29, 20, 0) 0deg 14deg, rgba(43, 29, 20, .5) 20deg, rgba(43, 29, 20, 0) 27deg 32deg),
              radial-gradient(circle, rgba(18, 13, 10, .96) 0 7%, rgba(43, 29, 20, .65) 24%, rgba(18, 13, 10, 0) 62%); }

/* ── Mischief Managed ──────────────────────────────────────────────────── */
.mischief { position: absolute; left: 0; right: 0; top: calc(var(--header-h) - 2px); bottom: 0; z-index: 30; perspective: 1600px; pointer-events: auto; }
.mm-ink { position: absolute; left: 0; top: 0; display: block; width: 100%; height: 100%; opacity: 0; }
.mm-panels { position: absolute; inset: 0; display: flex; opacity: 0; }
.mm-panel { position: relative; display: block; flex: 1 1 0; width: 33.34%; height: 100%; }
.mm-panel.l { transform-origin: 100% 50%; } .mm-panel.r { transform-origin: 0 50%; }

/* ── Ink writing ───────────────────────────────────────────────────────── */
.inksvg { display: block; overflow: visible; max-width: 100%; height: 100%; }
.ink-l { fill-opacity: 0; stroke-width: .6; stroke-linejoin: round; stroke-linecap: round; paint-order: stroke;
  animation: inkStroke var(--sd, 600ms) cubic-bezier(.45, 0, .3, 1) forwards, inkFill .5s ease forwards; }
@keyframes inkStroke { to { stroke-dashoffset: 0; } }
@keyframes inkFill { to { fill-opacity: 1; stroke-opacity: .25; } }

/* ── The group ─────────────────────────────────────────────────────────── */
.people { position: absolute; inset: 0; z-index: 46; display: grid; place-items: center; padding: 20px; background: rgba(18, 13, 10, .45); }
.people-card { position: relative; width: min(100%, 380px); max-height: 86%; overflow-y: auto; padding: 24px 20px 18px; border-radius: 6px;
  box-shadow: 0 14px 40px rgba(0, 0, 0, .45), inset 0 0 0 1px var(--rule-strong), inset 0 0 0 5px var(--paper), inset 0 0 0 6px var(--rule); }
.people-card .card-close { top: 10px; right: 10px; background: transparent; border-color: var(--rule-strong); color: var(--text); }
.pp-kicker { font-family: var(--f-fell); font-style: italic; color: var(--text-soft); text-align: center; font-size: 15px; padding: 0 40px; }
.pp-title { margin: 2px 0 6px; text-align: center; font-family: var(--f-script); font-weight: 400; font-size: 42px; line-height: 1.15; }
.pp-text { text-align: center; font-size: 16px; line-height: 1.4; color: var(--text-soft); margin: 0 0 14px; }
.pp-names { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pp-name { min-height: 58px; border: 1px solid var(--rule-strong); border-radius: 4px; font-family: var(--f-fell); font-size: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.pp-name small { font-size: 13px; font-style: italic; color: var(--text-soft); }
.pp-btn { display: block; width: 100%; min-height: 48px; margin-top: 10px; border-radius: 4px; font-family: var(--f-sc); letter-spacing: .1em; font-size: 16px; border: 1px solid var(--rule-strong); }
.pp-btn.primary { background: #2B1D14; color: #E8CC7A; border-color: #8A6A1C; }
.pp-row { display: flex; align-items: center; gap: 10px; min-height: 54px; border-bottom: 1px solid var(--rule); }
.pp-row b { font-family: var(--f-fell); font-size: 19px; font-weight: 400; min-width: 64px; }
.pp-row span { flex: 1; font-size: 14px; color: var(--text-soft); font-style: italic; line-height: 1.25; }
.pp-show { min-height: 40px; padding: 0 12px; border: 1px solid var(--rule-strong); border-radius: 4px; font-size: 14px; }
.pp-note { font-size: 14px; line-height: 1.35; color: var(--text-soft); font-style: italic; margin: 12px 0 0; text-align: center; }
.me-label small { display: block; margin-top: 2px; font: 11px/1 var(--f-body); opacity: .7; text-align: center; }
.friend .me-label { font-weight: 600; }
.friend.stale { opacity: .5; }

/* ── Toast ─────────────────────────────────────────────────────────────── */
.toast { position: absolute; z-index: 50; left: 50%; top: calc(var(--header-h) + 64px); max-width: min(90%, 380px); padding: 10px 16px; border-radius: 4px;
  background: #2B1D14; color: #F3E9D2; border: 1px solid #8A6A1C; font-size: 16px; text-align: center; box-shadow: var(--shadow); font-style: italic;
  transform: translate(-50%, -8px); opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ── Gold dust (taps) ──────────────────────────────────────────────────── */
#fx { position: fixed; inset: 0; z-index: 9999; pointer-events: none; overflow: hidden; }
.spark { position: absolute; left: 0; top: 0; width: 4px; height: 4px; margin: -2px 0 0 -2px; pointer-events: none; border-radius: 50%;
  background: radial-gradient(circle, #FFF8DA 0 25%, #E3C266 55%, rgba(201, 162, 39, 0) 75%); }

/* ── Candle motes ──────────────────────────────────────────────────────── */
.mote { position: absolute; bottom: -10px; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255, 228, 160, .9) 0 20%, rgba(255, 170, 70, .35) 50%, rgba(255, 150, 0, 0) 72%);
  animation: moteRise var(--dur) linear infinite, moteFlicker 2.2s ease-in-out infinite alternate; animation-delay: var(--del), var(--del2); opacity: 0; }
@keyframes moteRise { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(var(--dx), var(--rise), 0); } }
@keyframes moteFlicker { 0% { opacity: .05; } 35% { opacity: var(--o); } 100% { opacity: calc(var(--o) * .35); } }

/* ── Opening ───────────────────────────────────────────────────────────── */
#intro { position: fixed; inset: 0; z-index: 100; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: radial-gradient(ellipse 65% 50% at 50% 42%, #2C1C10 0%, #170F09 55%, #070504 100%); color: #F3E9D2;
  padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l); }
.intro-particles { position: absolute; inset: 0; pointer-events: none; }
.skip { position: absolute; z-index: 5; top: calc(var(--safe-t) + 8px); right: calc(var(--safe-r) + 10px); min-width: 64px; min-height: 44px; padding: 0 14px;

<script>
document.addEventListener('DOMContentLoaded', () => {
'use strict';

/* ═════════════════════════ Basics ═════════════════════════ */
const D = TRIP_DATA;
const TZ = (D.trip && D.trip.timeZone) || 'Europe/London';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const wait = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const params = new URLSearchParams(location.search);
const mqRM = matchMedia('(prefers-reduced-motion: reduce)');
const mqDark = { matches: false }; // always the light parchment look, whatever the phone's setting
let RM = mqRM.matches;
const applyRM = () => { RM = mqRM.matches; document.documentElement.classList.toggle('rm', RM); };
applyRM();
(mqRM.addEventListener ? mqRM.addEventListener('change', applyRM) : mqRM.addListener(applyRM));

const UA = navigator.userAgent;
const IS_IOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/i.test(UA);

const store = {
  get(k, d) { try { const v = localStorage.getItem('aparecium.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },

};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const app = $('#app');
const svgUrl = s => `url("data:image/svg+xml,${encodeURIComponent(s)}")`;
const rootStyle = document.documentElement.style;

/* ═════════════════════════ Time (always in the trip's zone) ═════════════════════════ */
const zoneFmt = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
function zoneParts(ms) { const o = {}; for (const p of zoneFmt.formatToParts(new Date(ms))) o[p.type] = p.value; return o; }

const NOW_OVERRIDE = (() => { const v = params.get('now'); if (!v) return null; const [d, t] = v.split('T'); if (!/^\d{4}-\d\d-\d\d$/.test(d)) return null; return { base: zonedToEpoch(d, (t || '12:00').slice(0, 5)), at: Date.now() }; })();
const nowMs = () => NOW_OVERRIDE ? NOW_OVERRIDE.base + (Date.now() - NOW_OVERRIDE.at) : Date.now();
function fmtDur(min) { min = Math.round(min); if (min < 60) return `${min} min`; const h = Math.floor(min / 60), m = min % 60; return m ? `${h} hr ${m} min` : `${h} hr`; }
function fmtUntil(ms) {
  const min = Math.ceil(ms / 60000);
  if (min <= 1) return 'under a minute';
  if (min < 60) return `${min} minutes`;
  if (min < 24 * 60) { const h = Math.floor(min / 60), m = min % 60; return `${h} hour${h > 1 ? 's' : ''}${m ? ` ${m} min` : ''}`; }

}
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV'];

/* ═════════════════════════ Data prep ═════════════════════════ */
const T = D.trip || {};
const DAYS = (D.days || []).map((d, i) => Object.assign({}, d, { index: i, num: i + 1 }));
DAYS.forEach(day => {
  day.stops = (day.stops || []).map((s, k) => {
    const start = zonedToEpoch(day.date, s.time);
    const end = start + (s.duration || 60) * 60000;
    return Object.assign({}, s, { kind: 'stop', key: 'stop:' + day.num + ':' + s.id, order: k + 1, day, baseStart: start, baseEnd: end, start, end });
  });
  day.food = (D.restaurants || []).filter(r => (r.days || []).includes(day.num))
    .map(r => Object.assign({}, r, { kind: 'food', key: 'food:' + day.num + ':' + r.id, day }));
});
const HOME = D.homeBase ? Object.assign({}, D.homeBase, { kind: 'home', key: 'home', id: 'home' }) : null;
function makeJourney(j, day, label) {
  if (!j || !day) return null;
  const start = zonedToEpoch(day.date, j.depart); let end = zonedToEpoch(day.date, j.arrive); if (end < start) end += 864e5;
  return Object.assign({}, j, { kind: 'journey', key: 'journey:' + label, name: label, day, start, end });
}
const J_THERE = makeJourney(T.travelThere, DAYS[0], `${T.travelThere && T.travelThere.mode || 'Train'} to ${T.city || 'the city'}`);
const J_HOME = makeJourney(T.travelHome, DAYS[DAYS.length - 1], `${T.travelHome && T.travelHome.mode || 'Train'} home to ${T.originCity || 'home'}`);
let EVENTS = [];
function rebuildEvents() { EVENTS = [J_THERE, ...DAYS.flatMap(d => d.stops), J_HOME].filter(Boolean).sort((a, b) => a.start - b.start); }
rebuildEvents();
const TRIP_START = EVENTS.length ? EVENTS[0].start : nowMs();
const TRIP_END = EVENTS.length ? Math.max(...EVENTS.map(e => e.end)) : nowMs();
const ITEMS = new Map();
DAYS.forEach(d => { d.stops.forEach(s => ITEMS.set(s.key, s)); d.food.forEach(f => ITEMS.set(f.key, f)); });
if (HOME) ITEMS.set('home', HOME);
[J_THERE, J_HOME].forEach(j => j && ITEMS.set(j.key, j));

/* Running late: shifts every stop of a day that hadn't finished when it was set */
function applyDelays() {
  DAYS.forEach(day => {
    const dl = store.get('late.' + day.date, null);
    day.delay = dl && dl.min ? dl : null;
    day.stops.forEach(s => {
      const shift = day.delay && s.baseEnd > day.delay.at ? day.delay.min * 60000 : 0;
      s.start = s.baseStart + shift; s.end = s.baseEnd + shift; s.shifted = shift > 0;
    });
  });
  rebuildEvents();
}
applyDelays();
const timeOf = s => clock(s.start);

/* ═════════════════════════ Generated art: parchment, seals, crest ═════════════════════════ */
function makeFibres(dark) {
  try {
    const S = 200, c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d'); const r = mulberry32(dark ? 9 : 42);
    const img = g.createImageData(S, S), rgb = dark ? [240, 205, 140] : [96, 62, 26], maxA = dark ? 16 : 30;
    for (let i = 0; i < img.data.length; i += 4) { if (r() < .55) { img.data[i] = rgb[0]; img.data[i + 1] = rgb[1]; img.data[i + 2] = rgb[2]; img.data[i + 3] = Math.round(r() * maxA); } }
    g.putImageData(img, 0, 0);
    g.lineCap = 'round';
    for (let k = 0; k < 70; k++) {
      g.strokeStyle = `rgba(${rgb.join(',')},${(r() * (dark ? .07 : .12)).toFixed(3)})`; g.lineWidth = .4 + r() * .6;
      const x = r() * S, y = r() * S, a = r() * Math.PI, l = 6 + r() * 26;
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * .5 + r() * 4, y + Math.sin(a) * l * .5 + r() * 4, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }

  } catch (e) { return 'none'; }
}
const stainSvg = (size, freq, seed, a, b) => `<svg xmlns='http://www.w3.org/2000/svg' width='${size}' height='${size}'><filter id='f' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='${freq}' numOctaves='5' seed='${seed}' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .30  0 0 0 0 .12  0 0 0 ${a} ${b}'/></filter><rect width='${size}' height='${size}' filter='url(#f)'/></svg>`;
const STAINS = stainSvg(900, .0045, 23, -1.35, .74), STAINS_STRONG = stainSvg(600, .008, 11, -1.7, .98);
function applyTextures() {
  const dark = mqDark.matches;

const WAND_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 150"><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#140A05"/><stop offset=".32" stop-color="#5E3F25"/><stop offset=".48" stop-color="#92704C"/><stop offset=".62" stop-color="#4E331D"/><stop offset="1" stop-color="#120804"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E0703"/><stop offset=".35" stop-color="#3E2614"/><stop offset=".5" stop-color="#6E4E30"/><stop offset=".68" stop-color="#2E1B0E"/><stop offset="1" stop-color="#0A0502"/></linearGradient></defs><g transform="translate(150 140) rotate(-128)"><ellipse cx="-3" cy="0" rx="5" ry="6.2" fill="url(#b)" stroke="#0A0502" stroke-width=".6"/><path d="M0 -5.6 C 8 -6.6, 14 -4.4, 20 -5.2 S 32 -6.2, 38 -4.8 S 46 -4.4, 50 -4.4 L 50 4.4 C 46 4.4, 42 5.2, 38 4.8 S 26 6.2, 20 5.2 S 8 6.6, 0 5.6 Z" fill="url(#b)" stroke="#0A0502" stroke-width=".5"/><path d="M10 -5.9 Q 11.5 0 10 5.9 M20 -5.3 Q 21.5 0 20 5.3 M30 -5.6 Q 31.5 0 30 5.6" stroke="#8A6A48" stroke-width=".7" fill="none" opacity=".55"/><path d="M50 -4.6 L 54 -4.2 L 54 4.2 L 50 4.6 Z" fill="#2A1A0C"/><path d="M54 -3.7 C 90 -2.8, 130 -1.9, 170 -1.0 Q 173 0 170 1.0 C 130 1.9, 90 2.8, 54 3.7 Z" fill="url(#a)"/><path d="M58 -1.6 C 100 -1.1, 140 -.6, 166 -.3" stroke="rgba(255,228,185,.28)" stroke-width=".7" fill="none"/><path d="M70 1.8 C 90 1.4, 110 1.2, 128 .8 M96 -2.2 C 112 -1.8, 130 -1.4, 148 -1" stroke="rgba(10,5,2,.45)" stroke-width=".4" fill="none"/><circle cx="171" cy="0" r="1.5" fill="#FFF6DA"/></g></svg>`;
const WAND_TIP = [44.4 / 170, 4.7 / 150]; // where the tip sits in the wand picture
function paintWand() {
  const im = new Image();
  im.onload = () => { const [, g] = makeCanvas(170, 150, $('#wandImg')); g.drawImage(im, 0, 0, 170, 150); };
  im.src = 'data:image/svg+xml,' + encodeURIComponent(WAND_SVG);
  const [, gg] = makeCanvas(60, 60, $('#wandGlow'));
  const rg = gg.createRadialGradient(30, 30, 0, 30, 30, 30); rg.addColorStop(0, 'rgba(255,249,230,1)'); rg.addColorStop(.22, 'rgba(255,227,160,.85)'); rg.addColorStop(1, 'rgba(255,192,96,0)');
  gg.fillStyle = rg; gg.fillRect(0, 0, 60, 60);
}
function setupIntroGeometry() {
  const W = Math.round(Math.min(innerWidth * .84, 400, (innerHeight * .58) / 1.1)), H = Math.round(W * 1.1);
  intro.style.setProperty('--W', W + 'px');
  const seed = 1031, inside = paintParchment(W, H, { seed, creases: [W * .25, W * .75], hcreases: [H * .5] });
  const backL = paintParchment(W / 4, H, { seed: seed + 1, back: true, edges: [1, 0, 1, 0], creases: [], hcreases: [H * .5] });
  const backR = paintParchment(W / 4, H, { seed: seed + 2, back: true, edges: [1, 0, 1, 0], creases: [], hcreases: [H * .5] });
  const slice = (el, x0, w) => { const [, g] = makeCanvas(w, H, el); g.drawImage(inside, x0 * DPR, 0, w * DPR, H * DPR, 0, 0, w, H); };
  slice($('.fp-left .front'), 0, W / 4); slice($('.fp-centre .front'), W / 4, W / 2); slice($('.fp-right .front'), W * .75, W / 4);
  const put = (el, src) => { const [, g] = makeCanvas(W / 4, H, el); g.drawImage(src, 0, 0, W / 4, H); };
  put($('.fp-left .back'), backL); put($('.fp-right .back'), backR);
  const [cover, cg] = makeCanvas(W / 2, H); cg.drawImage(backL, 0, 0, W / 4, H); cg.drawImage(backR, W / 4, 0, W / 4, H);
  // where the two flaps meet: a soft shadow and a hairline
  const sg = cg.createLinearGradient(W / 4 - 7, 0, W / 4 + 7, 0); sg.addColorStop(0, 'rgba(70,40,12,0)'); sg.addColorStop(.5, 'rgba(70,40,12,.22)'); sg.addColorStop(1, 'rgba(70,40,12,0)');
  cg.fillStyle = sg; cg.fillRect(W / 4 - 7, 4, 14, H - 8); cg.fillStyle = 'rgba(60,34,10,.5)'; cg.fillRect(W / 4 - .4, 4, .8, H - 8);
  IG = { W, H, inside, cover };
  makeCanvas(W / 2, H, $('#coverInk'))[1].drawImage(cover, 0, 0, W / 2, H);
  paintWand();
}

/* The wand: tap it, tap the parchment, or drag the wand onto the parchment */
let introStarted = false, wandOffset = { x: 0, y: 0 };
function wandTip() { const r = $('#wandImg').getBoundingClientRect(); return { x: r.left + r.width * WAND_TIP[0], y: r.top + r.height * WAND_TIP[1] }; }
function armWand() {
  const w = $('#wand'), stage = $('#foldStage');
  let drag = null;
  w.addEventListener('pointerdown', e => {
    if (introStarted || e.button > 0) return;
    Sound.init();
    drag = { x0: e.clientX - wandOffset.x, y0: e.clientY - wandOffset.y, sx: e.clientX, sy: e.clientY, moved: false };
    try { w.setPointerCapture(e.pointerId); } catch (_) { /* not supported */ }
    w.classList.add('held');
  });
  w.addEventListener('pointermove', e => {
    if (!drag || introStarted) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 8) return;
    drag.moved = true;
    wandOffset = { x: e.clientX - drag.x0, y: e.clientY - drag.y0 };
    w.style.transform = `translate(${wandOffset.x}px,${wandOffset.y}px)`;
    const t = wandTip(), r = $('#packetFace').getBoundingClientRect();
    if (t.x > r.left + 6 && t.x < r.right - 6 && t.y > r.top + 6 && t.y < r.bottom - 8) { drag = null; w.classList.remove('held'); touchParchment(t); }
  });
  const release = () => { if (!drag) return; drag = null; w.classList.remove('held'); if (!introStarted) glideWand(); };
  w.addEventListener('pointerup', release);
  w.addEventListener('pointercancel', release);
  w.addEventListener('click', e => { if (e.detail === 0) glideWand(); }); // keyboard (Enter / Space)
  stage.addEventListener('click', () => glideWand());
}
/* Carry the wand up until its tip rests on the parchment, then cast */
async function glideWand() {
  if (introStarted) return;
  introStarted = true; Sound.init();
  const w = $('#wand'), r = $('#packetFace').getBoundingClientRect(), t = wandTip();
  const target = { x: r.left + r.width * .5, y: r.top + r.height * .8 };
  const to = { x: wandOffset.x + target.x - t.x, y: wandOffset.y + target.y - t.y };
  if (!RM) { try { await w.animate([{ transform: `translate(${wandOffset.x}px,${wandOffset.y}px)` }, { transform: `translate(${to.x}px,${to.y}px)` }], { duration: 1100, easing: 'cubic-bezier(.35,.6,.2,1)', fill: 'forwards' }).finished; } catch (e) { /* cancelled */ } }
  wandOffset = to;
  touchParchment(target);
}
function touchParchment(pt) {
  introStarted = true;
  fullIntro(pt).catch(() => finishIntro(true)); // never leave anyone stuck on the opening
}
async function fullIntro(pt) {
  const wand = $('#wand'); if (introSkipped) return;
  wand.disabled = true; Sound.init(); Sound.cast();
  wand.classList.add('touch');
  dust(pt.x, pt.y, 8, 30, { rise: 10 });
  $('#hint').style.opacity = '0';
  if (RM) { finishIntro(true); return; }
  const { W, H } = IG, pr = $('#packetFace').getBoundingClientRect();
  const lx = clamp((pt.x - pr.left) / pr.width * (W / 2), 14, W / 2 - 14), ly = clamp((pt.y - pr.top) / pr.height * H, 14, H - 14);
  await fontsReady(['40px "Pinyon Script"', 'italic 16px "IM Fell English"']);
  if (introSkipped) return;
  // 1 — wet black ink blooms from the wand's tip, then runs out in fine lines that criss-cross and join, like a spider's web
  const cover = new InkCanvas($('#coverInk'), IG.cover, W / 2, H); introScenes.push(cover); cover.start();
  cover.blots.push({ x: lx, y: ly, t: 0, dur: 1200, R: W * .058, seed: 5 });
  cover.add(genNetwork({ x: lx, y: ly, w: W / 2, h: H, seed: 7, count: 7, depth: 2, step: 9, wiggle: .25, curvy: .3, smooth: 2, speed: .05, width: 1.8, max: 30, t0: 450, join: 18, joinShare: .4, margin: 12, alpha: .92 }));
  scratchFor(3200);
  await wait(3000); if (introSkipped) return;
  // 2 — the web settles into the paper and the words blossom
  cover.soften(.72, 1800);
  const fs = Math.round(W * .041), maxW = W / 2 * .84, fell = s => `italic ${s}px "IM Fell English"`, pin = s => `${s}px "Pinyon Script"`;
  const rows = []; let y = H * .1;
  const add = (text, size, font, gap, script) => { y += gap || 0; wrapCanvas(text, font(size), maxW).forEach(tx => { y += size * (script ? 1.05 : 1.28); rows.push({ tx, size, font: font(size), y, script }); }); };
  const names = coverNames();
  if (names) add(names, fs, fell);
  if (T.presentedTagline) add(T.presentedTagline, Math.round(fs * .82), fell, 6);
  if (names || T.presentedTagline) add('are proud to present', Math.round(fs * .82), fell, 6);
  add('Aparecium', Math.round(W * .12), pin, 12, true); add('Portus', Math.round(W * .12), pin, 0, true);
  let t = cover.now() + 300;
  rows.forEach(rw => { const dur = rw.script ? 1500 : Math.max(500, rw.tx.length * 40); cover.write(rw.tx, rw.font, rw.size, W / 4, rw.y, t, dur); t += dur * (rw.script ? .85 : .7); });
  scratchFor(t - cover.now());
  await wait(t - cover.now() + 1900); if (introSkipped) return;
  // 3 — the map unfolds, one panel and then the other
  $('#packetFace').style.opacity = '0'; wand.style.opacity = '0';
  await wait(800); if (introSkipped) return;
  cover.stop();
  const fm = $('#foldMap');
  $('.fp-left', fm).style.transitionDelay = '0ms'; $('.fp-right', fm).style.transitionDelay = '750ms';
  Sound.rustle(1.4, .11); setTimeout(() => Sound.rustle(1.3, .09), 750); setTimeout(() => { if (Sound.ok()) Sound.swell(Sound.ctx.currentTime, ['E2', 'B2', 'D3', 'G3'], 5, .016); }, 300);
  fm.classList.add('open'); $('#foldStage').classList.add('open');
  await wait(2400); if (introSkipped) return;
  // 4 — ink carries on from where the wand touched: streets, buildings, our places, and footsteps
  const inside = new InkCanvas($('#insideInk'), IG.inside, W, H); introScenes.push(inside);
  $('#insideInk').style.opacity = '1'; inside.start();
  const cx = W * .25 + lx, cy = ly, net = insideNet(W, H, cx, cy);
  inside.blots.push({ x: cx, y: cy, t: 0, dur: 900, R: W * .036, seed: 9 });
  const segs = genNetwork(net); inside.add(segs);
  inside.places.push(...placeLabels(W, H, cx, cy, net.speed));
  const netEnd = Math.max(...segs.map(s => s.t + s.dur));
  scratchFor(netEnd * .8);
  setTimeout(() => inside.walkers(marauderNames()), 1400);
  await wait(Math.min(netEnd, 3800)); if (introSkipped) return;
  inside.title = { t: inside.now(), dur: 1200, city: T.city || 'Our Trip', dates: tripDates() }; Sound.resolve();
  await wait(3000); if (introSkipped) return;
  finishIntro(false);
}
async function quickIntro() {
  $('#wand').style.display = 'none'; $('#packetFace').style.display = 'none'; $('#hint').style.display = 'none';
  const fm = $('#foldMap'); $$('.fpanel', fm).forEach(p => { p.style.transition = 'none'; }); fm.classList.add('open'); $('#foldStage').classList.add('open');
  const { W, H } = IG, inside = new InkCanvas($('#insideInk'), IG.inside, W, H);
  $('#insideInk').style.opacity = '1';
  const segs = genNetwork(insideNet(W, H, W / 2, H * .62)); segs.forEach(s => { s.t = -1e7; }); inside.add(segs);
  placeLabels(W, H, 0, 0, 1).forEach(L => { L.t = -1e7; inside.places.push(L); });
  inside.title = { t: -1e7, dur: 1, city: T.city || 'Our Trip', dates: tripDates() };
  inside.render();
  await wait(RM ? 200 : 700);
  if (introSkipped) return;
  if (RM) finishIntro(true); else { introFinished = true; store.set('introSeen', introKey()); await inkReveal(900); intro.remove(); introScenes.forEach(sc => sc.stop()); onAppReady(); }
}
function startIntro() {
  setupIntroGeometry();
  motes($('#introParticles'), 16, { dur: 14, size: 6 });
  $('#skipIntro').addEventListener('click', () => { introSkipped = true; finishIntro(true); });
  const mode = params.get('intro');
  if (mode === 'skip') { introSkipped = true; intro.remove(); introFinished = true; onAppReady(); return; }
  const full = mode !== 'quick'; // the full opening plays every time; Skip is always in the corner
  if (full) armWand(); else quickIntro();
}

/* ═════════════════════════ Boot ═════════════════════════ */
function onAppReady() {
  state.introDone = true;
  syncLayers(true, false);
  tick();
  setInterval(tick, 15000);
  WX.load(); loadAllWiki();
  Share.boot().then(() => { if (!Share.me) setTimeout(() => openPeople('who'), 700); });
  DAYS.forEach(d => d.stops.forEach((s, k) => { if (k) Routes.want(d.stops[k - 1], s); }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); renderTabs(); updateTabs(); } });
}
rootStyle.setProperty('--accent', (curDay() && curDay().accentColour) || '#6B1E2A');
motes($('#hParticles'), 6, { dur: 9, size: 4, rise: 24 });
renderTabs(); renderProgressTicks(); updateTabs(); updateModeUI(); renderSheet(); updateCountdown();
Sheet.measure();
initMap();
let rz = 0;
const onResize = () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { Sheet.measure(); if (map) map.invalidateSize(); buildStepsSoon(); }); };
addEventListener('resize', onResize);
if (window.ResizeObserver) new ResizeObserver(onResize).observe(elHeader);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(onResize);
startIntro();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
});
